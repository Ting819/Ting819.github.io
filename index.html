 for(const it of order){

<script id="ct174107LogicOnlyPatch">
(()=>{
  'use strict';

  // ===== 1) Team same-floor ranking: compare power first, then enemy HP% =====
  window.rank = rank = function(){
    let m=meta();
    return [...states].sort((a,b)=>b.floor-a.floor || m[b.city].power-m[a.city].power || a.enemy.hp/a.enemy.max-b.enemy.hp/b.enemy.max);
  };

  // V17.4.124: battle treasure slots are part of the authoritative card render itself.
  function ctBattleTreasureInline124(c){
    try{
      const api=window.__CT_TREASURE;
      if(!api||typeof api.itemsForChar!=='function'||!c)return '';
      const items=api.itemsForChar(c)||[];
      const names={X:'創世',U:'至尊',S:'神話',A:'傳說',B:'史詩',C:'稀有',D:'精良',E:'優良',F:'普通',Z:'凡品'};
      const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const slots=[0,1,2,3,4].map(i=>{
        const it=items[i];
        if(!it)return '<span class="tBattleSlot empty" title="空寶物槽">◇</span>';
        let img='',effect='';
        try{img=typeof api.svg==='function'?api.svg(it.type,it.tier):''}catch(e){}
        try{effect=typeof api.effect==='function'?api.effect(it.tier,it.type):''}catch(e){}
        const title=esc([it.tier+' '+(names[it.tier]||it.tier),it.name,effect].filter(Boolean).join('｜'));
        return `<span class="tBattleSlot ${it.tier}" title="${title}"><img src="${img}"><i><span class="tierLetter tierMotion ${it.tier}">${it.tier}</span></i></span>`;
      }).join('');
      return `<div class="tBattleTreasureStrip"><span class="tBattleTreasureLabel">寶物</span>${slots}</div>`;
    }catch(e){console.warn('CT124 inline treasure',e);return ''}
  }

  // ===== 2) Persistent render to avoid resetting rating/name animations every repaint =====
  window.render = render = function(){
    let m=meta(), rr=rank(), lead=rr[0], sel=states.find(x=>x.city===selected)||rr[0];
    $('kt').textContent=turn;
    $('kl').textContent=lead.city.replace(/[縣市]$/,'');
    $('kf').textContent=lead.floor+'F';

    const kr=$('kr'), selTier=m[sel.city].tier;
    let krTier=kr && kr.querySelector('.tierMotion');
    if(kr && !krTier){
      krTier=document.createElement('span');
      krTier.className='tier tierLetter tierMotion '+selTier;
      krTier.textContent=selTier;
      krTier.dataset.tier=selTier;
      kr.replaceChildren(krTier);
    }
    if(krTier && krTier.dataset.tier!==selTier){
      krTier.className='tier tierLetter tierMotion '+selTier;
      krTier.textContent=selTier;
      krTier.dataset.tier=selTier;
    }

    const kp=$('kp');
    if(kp){
      const pv=m[sel.city].power.toFixed(2);
      if(kp.textContent!==pv)kp.textContent=pv;
      if(kp.dataset.tier!==selTier){kp.className='ratingText '+selTier;kp.dataset.tier=selTier;}
    }

    const tb=$('rank');
    const oldRows=new Map([...tb.querySelectorAll('tr.team')].map(tr=>[tr.dataset.city,tr]));
    const rows=[];
    rr.forEach((s,i)=>{
      const tier=m[s.city].tier;
      let tr=oldRows.get(s.city), isNew=false;
      if(!tr){
        isNew=true;
        tr=document.createElement('tr');
        tr.className='team';
        tr.dataset.city=s.city;
        tr.innerHTML='<td></td><td><div class="city"></div><div class="sub"></div></td><td class="rankTierCell"><span class="rankTierAnchor"><span class="tier tierLetter tierMotion"></span></span></td><td></td><td><b></b><div class="sub"></div></td><td></td><td></td>';
        tr.onclick=()=>{selected=tr.dataset.city;render();};
      }
      tr.classList.toggle('sel',s.city===selected);
      if(tr.children[0].textContent!==String(i+1))tr.children[0].textContent=i+1;
      const teamCell=tr.children[1], tierNode=tr.children[2].querySelector('.tierMotion'), powCell=tr.children[3];
      if(isNew){
        teamCell.querySelector('.city').textContent=s.city;
        teamCell.querySelector('.sub').textContent=TEAMN[s.city]||'';
      }
      if(tr.dataset.tier!==tier){
        tr.dataset.tier=tier;
        teamCell.className='teamTint '+tier;
        tierNode.className='tier tierLetter tierMotion '+tier;
        tierNode.textContent=tier;
        tierNode.dataset.tier=tier;
        powCell.className='powerTint '+tier;
        powCell.dataset.tier=tier;
      }
      const ptxt=m[s.city].power.toFixed(2);
      if(powCell.textContent!==ptxt)powCell.textContent=ptxt;
      const floorCell=tr.children[4];
      floorCell.querySelector('b').textContent=s.floor+'F';
      floorCell.querySelector('.sub').textContent=s.ft+'T｜敵剩'+Math.round(s.enemy.hp/s.enemy.max*100)+'%';
      tr.children[5].innerHTML='<div class="partyMini">'+s.party.map(p=>`<div><div class="miniName">${p.name} Lv.${(window.__CT_FAST_CHAR_BY_ID?.(s.city,p.id)||R[s.city].find(c=>c.id===p.id)).lv}</div><div class="bar"><i style="width:${100*p.hp/p.max}%"></i></div><div class="sub">${Math.round(p.hp)}/${p.max}｜⚡ ${Math.round(p.g)}/100</div><div class="miniGauge17425" aria-label="攻擊條"><i style="width:${Math.max(0,Math.min(100,Number(p.g)||0))}%"></i></div></div>`).join('')+'</div>';
      {const ep=Math.max(0,Math.min(100,100*s.enemy.hp/Math.max(1,s.enemy.max)));tr.children[6].innerHTML=`<div class="rankEnemy174"><div class="reh174top"><span>${Math.round(s.enemy.hp)} / ${s.enemy.max}</span><span>${Math.round(ep)}%</span></div><div class="reh174track"><div class="reh174fill" style="width:${ep}%"></div></div></div>`;}
      rows.push(tr);
      oldRows.delete(s.city);
    });
    oldRows.forEach(tr=>tr.remove());
    let anchor=tb.firstElementChild;
    for(const tr of rows){
      if(tr!==anchor)tb.insertBefore(tr,anchor);
      anchor=tr.nextElementSibling;
    }

    let e=sel.enemy;
    $('arena').innerHTML=`<div class="enemy"><div class="cardTop"><div><b>${e.name}</b><div class="sub">ATK ${e.atk.toFixed(0)}｜DEF ${e.def.toFixed(0)}｜攻速 ${e.speed.toFixed(1)}</div></div><b>${Math.round(e.hp)} / ${e.max}</b></div><div class="monsterHp174"><div class="mh174top"><span>❤️ 怪物 HP</span><span class="mh174num">${Math.round(e.hp)} / ${e.max}</span></div><div class="mh174track"><div class="mh174fill" style="width:${Math.max(0,Math.min(100,100*e.hp/e.max))}%"></div></div><div class="mh174pct">剩餘 ${Math.round(Math.max(0,Math.min(100,100*e.hp/e.max)))}%</div></div><div class="gbar" style="margin-top:5px"><i style="width:${e.g}%"></i></div></div><div class="cards">${sel.party.map(p=>{let c=(window.__CT_FAST_CHAR_BY_ID?.(sel.city,p.id)||R[sel.city].find(x=>x.id===p.id));return `<div class="card ${p.alive?'':'dead'}"><div class="cardTop"><div><div class="name">${p.name}</div></div><b>${Math.round(p.hp)}/${p.max}</b></div><div class="ctExpRowFinal"><span class="ctLvFinal">Lv.${c.lv}</span><span class="ctExpValueFinal">EXP ${c.xp}/${xpNeed(c.lv)}</span></div><div class="xp173" aria-label="EXP進度"><i style="width:${Math.max(0,Math.min(100,100*c.xp/xpNeed(c.lv)))}%"></i></div><div class="bar"><i style="width:${100*p.hp/p.max}%"></i></div><div class="gbar" style="margin-top:5px"><i style="width:${p.g}%"></i></div>${window.ctBattleTreasureInline126(c)}<div class="stats"><div class="stat">ATK<b>${p.atk}</b></div><div class="stat">DEF<b>${p.def}</b></div><div class="stat">攻速<b>${p.speed.toFixed(1)}</b></div><div class="stat">爆擊<b>${Math.round(p.crit*100)}%</b></div><div class="stat">閃避<b>${Math.round((p.dodge||0)*100)}%</b></div><div class="stat">爆傷<b>+${Math.round((p.critDmg||.50)*100)}%</b></div></div></div>`}).join('')}</div>`;
    const battleLogEl=$('log')||$('battlelog');
    if(battleLogEl) battleLogEl.innerHTML='<div class="sub">'+sel.city+'｜'+(TEAMN[sel.city]||'')+'</div>'+sel.log.slice(0,18).map(x=>'<div>'+x+'</div>').join('');
  };

  // ===== 3) Team tier thresholds kept but widened as latest logic =====
  window.meta = meta = function(){
    let a=Object.keys(R).map(city=>({city,power:10*teamRaw(city)/initialTop})).sort((x,y)=>y.power-x.power);
    a.forEach((x,i)=>x.rank=i+1);
    for(const x of a){let v=x.power,r=x.rank;x.tier=v>=9&&r<=3?'S':v>=8&&r<=7?'A':v>=7&&r<=11?'B':v>=6&&r<=15?'C':v>=4.5&&r<=18?'D':v>=4?'E':'F'}
    if(a[0]&&a[1]&&a[0].power>=20&&a[0].power>=a[1].power*1.12)a[0].tier='U';
    else if(a[1]&&a[2]&&a[1].power>=20&&a[1].power>=a[2].power*1.12)a[1].tier='U';
    if(a[0]&&a[1]&&a[0].power>=50&&a[0].power>=a[1].power*1.25)a[0].tier='X';
    let z=a[a.length-1],p=a[a.length-2];if(z&&p&&z.power<3.3&&z.power<=p.power*.92)z.tier='Z';
    return Object.fromEntries(a.map(x=>[x.city,x]));
  };

  // ===== 4) Character tiers use PR; U up to 3, X unique =====
  window.charMeta = function charMetaV174(){
    // V17.4.112：與角色資料頁顯示的「個人戰力」完全同一把尺。
    let a=Object.values(R).flat().map(c=>({id:c.id,power:10*craw(c)/initialTop})).sort((x,y)=>y.power-x.power||String(x.id).localeCompare(String(y.id),'zh-Hant'));
    const n=a.length, EPS=1e-9;
    a.forEach((x,i)=>x.rank=i+1);
    for(let i=0;i<n;){
      let j=i+1;while(j<n && Math.abs(a[j].power-a[i].power)<=EPS)j++;
      const avgRank=((i+1)+j)/2, pr=n>1?100*(n-avgRank)/(n-1):100;
      for(let k=i;k<j;k++)a[k].pr=Math.max(0,Math.min(100,pr));
      i=j;
    }
    for(const x of a){const pr=x.pr;x.tier=pr>=95?'S':pr>=85?'A':pr>=70?'B':pr>=50?'C':pr>=30?'D':pr>=15?'E':pr>=5?'F':'Z';}
    if(a[0] && a[0].power>=50 && (!a[1] || a[0].power>a[1].power))a[0].tier='X';
    let uCount=0;
    for(const x of a){
      if(uCount>=3)break;
      if(x.tier==='X')continue;
      if(x.power>=20){x.tier='U';uCount++;} else break;
    }
    return Object.fromEntries(a.map(x=>[x.id,x]));
  };

  // ===== 5) Warm-up: 1~300F slower monster growth =====
  function warmupMul(f){
    f=Math.max(1,Number(f)||1);
    if(f<=100)return 0.35;
    if(f<=200)return 0.35+(f-100)/100*0.15;
    if(f<=250)return 0.50+(f-200)/50*0.15;
    if(f<=300)return 0.65+(f-250)/50*0.15;
    return 1;
  }
  const PREV_ENEMY = window.enemy;
  window.enemy = enemy = function(f,fails=0){
    const e = PREV_ENEMY(f,fails), w = warmupMul(f);
    if(f<=300){
      e.max=Math.max(1,Math.round(e.max*w));
      e.hp=e.max;
      const aw=0.58+0.42*w, dw=0.62+0.38*w;
      e.atk=Math.max(1,e.atk*aw);
      e.def=Math.max(0,e.def*dw);
      e.warmup=w;
    }
    return e;
  };
  try{
    for(const s of states||[]){
      if(!s || !s.enemy || s.floor>300)continue;
      const pct=s.enemy.max?Math.max(0,Math.min(1,s.enemy.hp/s.enemy.max)):1, g=s.enemy.g||0;
      const n=enemy(s.floor,s.failsAtFloor||0); n.hp=Math.round(n.max*pct); n.g=g; s.enemy=n;
    }
  }catch(e){console.warn('warm-up migrate',e);}

  // ===== 6) Team rating growth on future level-ups =====
  const TEAM_LV_GROWTH={Z:{atk:15,hp:10},F:{atk:16,hp:11},E:{atk:17,hp:12},D:{atk:18,hp:13},C:{atk:19,hp:14},B:{atk:21,hp:15},A:{atk:24,hp:17},S:{atk:28,hp:20},U:{atk:38,hp:27},X:{atk:55,hp:40}};
  const PREV_CSTATS = window.cstats;
  window.cstats = cstats = function(c){
    const st=PREV_CSTATS(c);
    st.atk=Math.max(1,Math.round(st.atk+(Number(c.ctAtkGrowth)||0)));
    st.hp=Math.max(1,Math.round(st.hp+(Number(c.ctHpGrowth)||0)));
    return st;
  };
  function teamTierNow(city){ try{return meta()[city]?.tier||'Z';}catch(e){return 'Z';} }
  window.gain = gain = function(c,n){
    c.xp=(Number(c.xp)||0)+(Number(n)||0);
    while(c.xp>=xpNeed(c.lv)){
      const tier=teamTierNow(c.city), g=TEAM_LV_GROWTH[tier]||TEAM_LV_GROWTH.Z;
      c.xp-=xpNeed(c.lv); c.lv++;
      c.ctAtkGrowth=(Number(c.ctAtkGrowth)||0)+g.atk;
      c.ctHpGrowth=(Number(c.ctHpGrowth)||0)+g.hp;
    }
  };

  // ===== 7) Genesis catch-up damage and rating EXP bonus =====
  const ROLE_XP={Z:2,F:3,E:4,D:5,C:6,B:8,A:10,S:13,U:18,X:25};
  function genesisInfo(){
    let xCity=null,xFloor=0;
    try{
      const mm=meta();
      for(const city of Object.keys(mm))if(mm[city]?.tier==='X'){xCity=city;break;}
      if(xCity){const xs=states.find(z=>z.city===xCity);xFloor=xs?.floor||0;}
    }catch(e){}
    return {xCity,xFloor};
  }
  function genesisDmgMul(city){
    const g=genesisInfo();
    if(!g.xCity || city===g.xCity)return 1;
    const s=states.find(z=>z.city===city), gap=Math.max(0,g.xFloor-(s?.floor||0));
    if(gap<25)return 1;
    if(gap<50)return 1.03;
    if(gap<100)return 1.06;
    if(gap<200)return 1.10;
    if(gap<400)return 1.15;
    if(gap<700)return 1.20;
    return 1.25;
  }
  const PREV_HIT = window.hit;
  window.hit = hit = function(s,p){
    let c=R[s.city].find(x=>x.id===p.id);
    if(!c)return PREV_HIT(s,p);
    const cm=window.charMeta?.()||{}, tier=(cm[c.id]?.tier)||'Z', critBefore=Number(c.crits)||0, before=Math.max(0,Number(s.enemy?.hp)||0);
    let killed=PREV_HIT(s,p);
    const crit=(Number(c.crits)||0)>critBefore;
    let bonus=ROLE_XP[tier]||2;
    if(crit)bonus=Math.round(bonus*1.5);
    gain(c,bonus);
    c.ctRatingXp=(Number(c.ctRatingXp)||0)+bonus;
    if(!killed && s.enemy && s.enemy.hp>0){
      const dealt=Math.max(0,before-s.enemy.hp), mul=genesisDmgMul(s.city);
      if(dealt>0 && mul>1){
        const extra=Math.max(1,Math.round(dealt*(mul-1)));
        s.enemy.hp=Math.max(0,s.enemy.hp-extra);
        if(s.enemy.hp<=0){
          c.kills=(Number(c.kills)||0)+1;
          let k=XP_K[s.enemy.key]||12; gain(c,k); killed=true;
          log(s,`🌌 創世威壓追趕 ×${mul.toFixed(2)}｜追加 -${extra}｜擊殺 EXP +${k}`);
        }
      }
    }
    if(killed){
      s.ctKoAttacker174133=p.id;
      s.ctKoFlashPainted174133=false;
    }
    return killed;
  };

  try{ render(); save(true); }catch(e){ console.warn('CT174107 init',e); }
})();
</script>

<script id="ct174127StatsRecalc">
(()=>{
'use strict';

    hp:Math.max(1,Math.round((Number(c.hp)||1)*10*(1+n*.0130)*g)),

    def:Math.max(0,Math.round((Number(c.def)||0)*(1+n*.0108)*g)),
    speed:Math.max(4,8+((Number(c.mob)||50)-50)/150*16+n*.055),
    crit:Math.max(.02,.05+((Number(c.tech)||50)-50)/150*.18+n*.00055),

  };

  const seen=new Set();
  for(const it of items127(c)){
    if(!it||seen.has(it.type))continue; seen.add(it.type);
    if(it.tier==='X'){
      const x=XFX127[it.type]||{};

      else if(it.type==='wing'){s.speed*=1+(x.speed||0)/100;s.crit+=(x.crit||0)/100;s.dodge+=(DODGE_BY_TIER.X||0)}

      continue;
    }
    const v=TREASURE_PWR[it.tier]||0;
    if(it.type==='blade'){s.atk*=1+v;s.crit+=v*.12}
    else if(it.type==='shield'){s.hp*=1+v*.80;s.def*=1+v*.70}
    else if(it.type==='wing'){s.speed*=1+v*.45;s.crit+=v*.09;s.dodge+=(DODGE_BY_TIER[it.tier]||0)}
    else if(it.type==='core'){s.hp*=1+v*.55;s.atk*=1+v*.55;s.def*=1+v*.45}
    else if(it.type==='sigil'){s.crit+=v*.14;s.speed*=1+v*.25;s.critDmg+=(CRITDMG_BY_TIER[it.tier]||0)}

}
function finalize127(s,c,baseOnly=false){

  const dodgeOverflow=Math.max(0,s.dodge-CAP_DODGE), critOverflow=Math.max(0,s.crit-CAP_CRIT), critDmgOverflow=Math.max(0,s.critDmg-CAP_CRITDMG);
  const dodgePts=dodgeOverflow*100;

  if(dodgePts>0){const m=1+dodgePts/100;s.hp*=m;s.def*=m}
  // Every 1% crit above 80% -> +1% ATK and +1 speed.
  // Every 10% crit-damage above 500% -> +1% ATK and +1 speed.
  const offenseConvertPts=critOverflow*100+(critDmgOverflow*100)/10;
  if(offenseConvertPts>0){s.atk*=1+offenseConvertPts/100;s.speed+=offenseConvertPts}
  s.dodge=Math.min(CAP_DODGE,Math.max(.02,s.dodge));
  s.crit=Math.min(CAP_CRIT,Math.max(.02,s.crit));
  s.critDmg=Math.min(CAP_CRITDMG,Math.max(.50,s.critDmg));
  s.speed=Math.max(4,s.speed); // no upper cap; >100 can naturally multi-hit via the attack gauge.
  s.hp=Math.max(1,Math.round(s.hp));s.atk=Math.max(1,Math.round(s.atk));s.def=Math.max(0,Math.round(s.def));

function calc127(c,baseOnly=false){

window.cstats=cstats=function(c){return calc127(c,false)};
window.craw=craw=function(c){

  return Math.sqrt(Math.max(1,ehp*dps));
};
window.teamRaw=teamRaw=function(city){const arr=R[city]||[];return arr.length?arr.reduce((a,c)=>a+craw(c),0)/arr.length:0};
function baselinePower127(c){
  const s=calc127({...c,lv:1,xp:0,bonus:0,ctAtkGrowth:0,ctHpGrowth:0,treasureIds:[],treasureId:null},true);
  const ehp=s.hp*(1+s.def*.006)/Math.max(.50,1-s.dodge),dps=s.atk*(s.speed/100)*(1+s.crit*s.critDmg);
  return Math.sqrt(Math.max(1,ehp*dps));
}
function baselineTop127(){

  for(const city of Object.keys(R||{})){
    const arr=R[city]||[];if(!arr.length)continue;

}
initialTop=baselineTop127();window.__CT127_INITIAL_TOP=initialTop;
window.meta=meta=function(){
  let a=Object.keys(R).map(city=>({city,power:10*teamRaw(city)/initialTop})).sort((x,y)=>y.power-x.power);
  a.forEach((x,i)=>x.rank=i+1);

  if(a[0]&&a[1]&&a[0].power>=20&&a[0].power>=a[1].power*1.12)a[0].tier='U';
  else if(a[1]&&a[2]&&a[1].power>=20&&a[1].power>=a[2].power*1.12)a[1].tier='U';
  if(a[0]&&a[1]&&a[0].power>=50&&a[0].power>=a[1].power*1.25)a[0].tier='X';
  const z=a[a.length-1],p=a[a.length-2];if(z&&p&&z.power<3.3&&z.power<=p.power*.92)z.tier='Z';
  return Object.fromEntries(a.map(x=>[x.city,x]));
};
window.CT_STAT_CAPS={dodge:CAP_DODGE,crit:CAP_CRIT,critDmg:CAP_CRITDMG,speed:null};
window.CT_TREASURE_NEW_STATS={dodgeByTier:DODGE_BY_TIER,critDmgByTier:CRITDMG_BY_TIER};

function refreshParty127(){
  try{for(const s of states||[])for(const p of s.party||[]){const c=R[s.city]?.find(x=>x.id===p.id);if(!c)continue;const oldMax=Math.max(1,Number(p.max)||1),ratio=Math.max(0,Math.min(1,(Number(p.hp)||0)/oldMax)),st=cstats(c);p.max=st.hp;p.hp=p.alive===false?0:Math.max(1,Math.round(st.hp*ratio));p.atk=st.atk;p.def=st.def;p.speed=st.speed;p.crit=st.crit;p.dodge=st.dodge;p.critDmg=st.critDmg}}

}
refreshParty127();

function teamAvg127(city){

<script id="ct174130DodgeBreakthrough">
(()=>{
'use strict';
const NAT_DODGE_CAP_130=.50, FINAL_DODGE_CAP_130=.70;
const DODGE_BY_TIER_130={Z:.005,F:.010,E:.015,D:.020,C:.030,B:.040,A:.060,S:.090,U:.140,X:.200};
const prevCstats130=window.cstats;
if(typeof prevCstats130!=='function')return;

function naturalDodgeRaw130(c){
  const n=Math.max(0,(Number(c?.lv)||1)-1);
  return Math.max(.02,.03+((Number(c?.mob)||50)-50)/150*.24+n*.00040);
}
function treasureDodge130(c){
  let add=0;
  try{
    const its=window.__CT_TREASURE?.itemsForChar?.(c)||[];
    const seen=new Set();
    for(const it of its){
      if(!it||seen.has(it.type))continue;
      seen.add(it.type);
      if(it.type==='wing')add+=DODGE_BY_TIER_130[it.tier]||0;
    }
  }catch(e){}
  // Current one-type rule means at most one wing; hard cap the treasure-breakthrough portion at +20%.
  return Math.max(0,Math.min(.20,add));
}

window.cstats=cstats=function(c){
  const s=prevCstats130(c);
  const naturalRaw=naturalDodgeRaw130(c);
  const gearAdd=treasureDodge130(c);
  const oldTotalRaw=naturalRaw+gearAdd;
  const oldOverflow=Math.max(0,oldTotalRaw-NAT_DODGE_CAP_130);
  const naturalOverflow=Math.max(0,naturalRaw-NAT_DODGE_CAP_130);

  // V127 converted ALL dodge above 50% to HP/DEF. Undo only the treasure-caused part,
  // while preserving the intended conversion from natural dodge overflow.
  if(Math.abs(oldOverflow-naturalOverflow)>1e-12){
    const oldMul=1+oldOverflow, newMul=1+naturalOverflow;
    s.hp=Math.max(1,Math.round((Number(s.hp)||1)/oldMul*newMul));
    s.def=Math.max(0,Math.round((Number(s.def)||0)/oldMul*newMul));
  }

  s.naturalDodge=Math.min(NAT_DODGE_CAP_130,Math.max(.02,naturalRaw));
  s.treasureDodge=gearAdd;
  s.dodge=Math.min(FINAL_DODGE_CAP_130,s.naturalDodge+gearAdd);
  s.dodgeOverflow=naturalOverflow; // only natural overflow converts to HP/DEF
  s.dodgeFinalCap=FINAL_DODGE_CAP_130;
  return s;
};

// Recalculate character/team power using the ACTUAL final dodge, including treasure breakthrough to 70%.
window.craw=craw=function(c){
  const s=cstats(c);
  const ehp=s.hp*(1+s.def*.006)/Math.max(1-FINAL_DODGE_CAP_130,1-s.dodge);
  const dps=s.atk*(s.speed/100)*(1+s.crit*s.critDmg);
  return Math.sqrt(Math.max(1,ehp*dps));
};
window.teamRaw=teamRaw=function(city){
  const arr=R[city]||[];
  return arr.length?arr.reduce((a,c)=>a+craw(c),0)/arr.length:0;
};
window.CT_STAT_CAPS={...(window.CT_STAT_CAPS||{}),dodge:NAT_DODGE_CAP_130,dodgeNatural:NAT_DODGE_CAP_130,dodgeFinal:FINAL_DODGE_CAP_130,treasureDodgeBreakthrough:.20,crit:.80,critDmg:5.00,speed:null};

// Existing parties keep HP percentage but immediately receive the corrected combat stats.
try{
  for(const st of states||[])for(const p of st.party||[]){
    const c=R[st.city]?.find(x=>x.id===p.id);if(!c)continue;
    const oldMax=Math.max(1,Number(p.max)||1), ratio=Math.max(0,Math.min(1,(Number(p.hp)||0)/oldMax)), ns=cstats(c);
    p.max=ns.hp;p.hp=p.alive===false?0:Math.max(1,Math.round(ns.hp*ratio));
    p.atk=ns.atk;p.def=ns.def;p.speed=ns.speed;p.crit=ns.crit;p.dodge=ns.dodge;p.critDmg=ns.critDmg;
  }
}catch(e){console.warn('CT130 party refresh',e)}

// Make the roster overflow note explicit: treasure dodge is breakthrough, not overflow conversion.
// V17.4.152 cleanup: obsolete V130 roster wrapper removed; final roster rendering is canonical below.

try{document.title=document.title.replace(/V17\.4\.\d+/g,'V17.4.130');const h1=document.querySelector('h1');if(h1)h1.innerHTML=h1.innerHTML.replace(/V17\.4\.\d+/g,'V17.4.130')}catch(e){}

try{if(typeof render==='function')render();if(typeof save==='function')save(true)}catch(e){console.warn('CT130 final render',e)}
})();
</script>

<script id="ct174131CritTreasureRules">
(()=>{
'use strict';
const NAT_DODGE=.50, GEAR_DODGE_CAP=.20, FINAL_DODGE=.70;
const NAT_CRIT=.60, FINAL_CRIT=1.00;
const NAT_CRITDMG=5.00, GEAR_CRITDMG_CAP=2.00, FINAL_CRITDMG=7.00;
const TP={Z:.015,F:.025,E:.040,D:.060,C:.090,B:.130,A:.180,S:.450,U:1.000,X:2.200};

const CDMG={Z:.02,F:.03,E:.05,D:.07,C:.10,B:.15,A:.22,S:.35,U:.55,X:2.00};
const XFX={blade:{atk:220,crit:25},shield:{hp:175,def:155},wing:{speed:100,crit:20},core:{hp:120,atk:120,def:100},sigil:{crit:30,speed:55,critDmg:200}};

function items(c){try{return window.__CT_TREASURE?.itemsForChar?.(c)||[]}catch(e){return[]}}
function base(c,baseOnly=false){
  const n=baseOnly?0:Math.max(0,(Number(c?.lv)||1)-1),g=baseOnly?1:1+(Number(c?.bonus)||0);
  return {
    hp:Math.max(1,(Number(c?.hp)||1)*10*(1+n*.0130)*g),
    atk:Math.max(1,(Number(c?.atk)||1)*(1+n*.0120)*g),
    def:Math.max(0,(Number(c?.def)||0)*(1+n*.0108)*g),

    critRaw:Math.max(.02,.05+((Number(c?.tech)||50)-50)/150*.18+n*.00055),
    dodgeRaw:Math.max(.02,.03+((Number(c?.mob)||50)-50)/150*.24+n*.00040),

  };

  for(const it of items(c)){
    if(!it||seen.has(it.type))continue;seen.add(it.type);
    if(it.tier==='X'){
      const x=XFX[it.type]||{};
      if(it.type==='blade'){g.atkMul*=1+(x.atk||0)/100;g.crit+=(x.crit||0)/100}
      else if(it.type==='shield'){g.hpMul*=1+(x.hp||0)/100;g.defMul*=1+(x.def||0)/100}
      else if(it.type==='wing'){g.speedMul*=1+(x.speed||0)/100;g.crit+=(x.crit||0)/100;g.dodge+=DODGE.X}
      else if(it.type==='core'){g.hpMul*=1+(x.hp||0)/100;g.atkMul*=1+(x.atk||0)/100;g.defMul*=1+(x.def||0)/100}
      else if(it.type==='sigil'){g.crit+=(x.crit||0)/100;g.speedMul*=1+(x.speed||0)/100;g.critDmg+=(x.critDmg||0)/100}
      continue;
    }

    else if(it.type==='shield'){g.hpMul*=1+v*.80;g.defMul*=1+v*.70}
    else if(it.type==='wing'){g.speedMul*=1+v*.45;g.crit+=v*.09;g.dodge+=DODGE[it.tier]||0}
    else if(it.type==='core'){g.hpMul*=1+v*.55;g.atkMul*=1+v*.55;g.defMul*=1+v*.45}

function calc(c,baseOnly=false){

<script>
(()=>{
  'use strict';

  function ctRawTeamPowerMap(){
    const out={};
    for(const city of Object.keys(R||{})){
      out[city]=10*teamRaw(city)/Math.max(1e-9,Number(initialTop)||1);
    }
    return out;
  }

  function ctProgressRank(raw){
    return [...(states||[])].sort((a,b)=>{
      const af=Number(a?.floor)||0, bf=Number(b?.floor)||0;
      if(bf!==af)return bf-af;
      const ar=(Number(a?.enemy?.hp)||0)/Math.max(1,Number(a?.enemy?.max)||1);
      const br=(Number(b?.enemy?.hp)||0)/Math.max(1,Number(b?.enemy?.max)||1);
      if(Math.abs(ar-br)>1e-12)return ar-br;
      const ap=Number(raw[a?.city])||0, bp=Number(raw[b?.city])||0;
      if(Math.abs(bp-ap)>1e-12)return bp-ap;
      return String(a?.city||'').localeCompare(String(b?.city||''),'zh-Hant');
    });
  }

  function ctTwo(x){ return Math.round((Number(x)||0)*100)/100; }

  // 排名仍以樓層/當層進度為主；戰力指數則保證由上往下嚴格不增加。
  window.meta = meta = function(){
    const raw=ctRawTeamPowerMap();
    const rr=ctProgressRank(raw);
    const a=[];
    let prev=Infinity;

    rr.forEach((s,i)=>{
      const rawPower=ctTwo(raw[s.city]);
      let power;
      if(i===0){
        power=rawPower;
      }else{
        const ceiling=ctTwo(prev-0.01);
        power=Math.min(rawPower,ceiling);
      }
      power=Math.max(0,power);
      prev=power;
      a.push({city:s.city,power,rawPower,rank:i+1,tier:'F'});
    });

    // 基礎評級先依「排名後的戰力指數」判定。
    for(const x of a){
      const v=x.power,r=x.rank;
      x.tier=v>=9&&r<=3?'S':v>=8&&r<=7?'A':v>=7&&r<=11?'B':v>=6&&r<=15?'C':v>=4.5&&r<=18?'D':v>=4?'E':'F';
    }

    // 先決定唯一 X。
    if(a[0] && a[1] && a[0].power>=50 && a[0].power>=a[1].power*1.25){
      a[0].tier='X';
    }

    // 再從「非 X」隊伍往下找一個 U；因此 X 不會再把 U 名額吃掉。
    const nonX=a.filter(x=>x.tier!=='X');
    for(let i=0;i<nonX.length-1;i++){
      const cur=nonX[i], next=nonX[i+1];
      if(cur.rank>3)break;
      if(cur.power>=20 && cur.power>=next.power*1.12){
        cur.tier='U';
        break;
      }
    }

    const z=a[a.length-1], p=a[a.length-2];
    if(z&&p&&z.power<3.3&&z.power<=p.power*.92)z.tier='Z';
    return Object.fromEntries(a.map(x=>[x.city,x]));
  };

  // 排名規則保持原本的爬塔進度邏輯，不用 meta() 反過來排序，避免循環與跳動。
  window.rank = rank = function(){
    return ctProgressRank(ctRawTeamPowerMap());
  };
})();
</script>

<script id="ctTeamPRRatingSystem">
(()=>{
  'use strict';

  /*
    Team rating:
    - X: max 1 team, only current #1 by team power, absolute power >= 50,
         and >= 25% above #2.
    - U: max 1 team, only the strongest non-X team, absolute power >= 20,
         and >= 12% above the next non-X team.
    - Everyone else uses power percentile rank (PR) among all 22 teams:
      S >= 85, A >= 70, B >= 55, C >= 40,
      D >= 25, E >= 15, F >= 5, Z < 5.
    PR formula: (N-rank)/(N-1)*100, so #1=100 and last=0.
    Tower/floor ranking can still use the game's normal progress order;
    this block changes team rating only.
  */

  function ctPRRawPowerMap(){
    const out={};
    for(const city of Object.keys(R||{})){
      out[city]=10*teamRaw(city)/Math.max(1e-9,Number(initialTop)||1);
    }
    return out;
  }

  function ctPRTwo(n){return Math.round((Number(n)||0)*100)/100;}

  function ctPRTier(pr){
    if(pr>=85)return 'S';
    if(pr>=70)return 'A';
    if(pr>=55)return 'B';
    if(pr>=40)return 'C';
    if(pr>=25)return 'D';
    if(pr>=15)return 'E';
    if(pr>=5)return 'F';
    return 'Z';
  }

  window.meta = meta = function(){
    const raw=ctPRRawPowerMap();

    // 先用純隊伍戰力計算原始 PR／原始評級；powerRank 只代表戰力名次。
    const byPower=Object.keys(raw).sort((a,b)=>{
      const d=(Number(raw[b])||0)-(Number(raw[a])||0);
      return Math.abs(d)>1e-12?d:String(a).localeCompare(String(b),'zh-Hant');
    });

    const n=byPower.length;
    const data=byPower.map((city,i)=>{
      const powerRank=i+1;
      const pr=n<=1?100:((n-powerRank)/(n-1))*100;
      return {
        city,
        rawPower:ctPRTwo(raw[city]),
        power:ctPRTwo(raw[city]),
        rank:powerRank,
        powerRank,
        pr:Math.round(pr*10)/10,
        tier:ctPRTier(pr)
      };
    });

    // X / U 仍先依隊伍戰力資格產生；最後再接受主排行榜名次鎖定。
    if(data[0] && data[1] &&
       data[0].power>=50 &&
       data[0].power>=data[1].power*1.25){
      data[0].tier='X';
    }
    const nonX=data.filter(x=>x.tier!=='X');
    if(nonX[0] && nonX[1] &&
       nonX[0].power>=20 &&
       nonX[0].power>=nonX[1].power*1.12){
      nonX[0].tier='U';
    }

    const byCity=Object.fromEntries(data.map(x=>[x.city,x]));

    // 主排行榜正式名次：樓層高者優先；同樓層先看怪物剩餘 HP%，再看戰力。
    const progress=[...(states||[])].sort((a,b)=>{
      const af=Number(a?.floor)||0, bf=Number(b?.floor)||0;
      if(bf!==af)return bf-af;
      const ar=(Number(a?.enemy?.hp)||0)/Math.max(1,Number(a?.enemy?.max)||1);
      const br=(Number(b?.enemy?.hp)||0)/Math.max(1,Number(b?.enemy?.max)||1);
      if(Math.abs(ar-br)>1e-12)return ar-br;
      const ap=Number(raw[a?.city])||0, bp=Number(raw[b?.city])||0;
      if(Math.abs(bp-ap)>1e-12)return bp-ap;
      return String(a?.city||'').localeCompare(String(b?.city||''),'zh-Hant');
    });

    // rank 改為畫面真正顯示的主排行榜名次；powerRank 保留純戰力名次。
    progress.forEach((s,i)=>{if(byCity[s.city])byCity[s.city].rank=i+1;});

    // 以高排名為準：低排名可同級或更低，但永遠不能高於任何上方隊伍。
    // 只向下修正，絕不把高排名隊伍為了配合後面而往上抬級。
    const tierOrder=['X','U','S','A','B','C','D','E','F','Z'];
    for(let i=1;i<progress.length;i++){
      const prev=byCity[progress[i-1].city], cur=byCity[progress[i].city];
      if(!prev||!cur)continue;
      const p=tierOrder.indexOf(prev.tier), c=tierOrder.indexOf(cur.tier);
      if(p>=0 && c>=0 && c<p)cur.tier=prev.tier;
    }

    return byCity;
  };

  // Expose thresholds for team-data / future UI descriptions.
  window.CT_TEAM_PR_RATING={
    x:{maxTeams:1,minPower:50,gap:1.25},
    u:{maxTeams:1,minPower:20,gap:1.12},
    rankLock:'main-progress-rank-high-first',
    updateSafe:true,
    build:CT_BUILD_VERSION,
    prBands:[
      {tier:'S',min:85},{tier:'A',min:70},{tier:'B',min:55},
      {tier:'C',min:40},{tier:'D',min:25},{tier:'E',min:15},
      {tier:'F',min:5},{tier:'Z',min:0}
    ]
  };

  try{
    if(typeof render==='function')render();
  }catch(e){console.warn('CT team PR rating render',e)}
})();
</script>

<script id="ctAppAutoUpdate">
(function(){
  const BUILD = document.querySelector('meta[name="ct-app-build"]')?.content || '';
  const isStandalone =
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;

  if(!isStandalone) return;

  async function checkUpdate(){
    try{
      const base = location.origin + location.pathname;
      const res = await fetch(base + '?ct_update_check=' + Date.now(), {
        cache:'no-store',
        credentials:'same-origin',
        headers:{'Cache-Control':'no-cache'}
      });
      if(!res.ok) return;

      const html = await res.text();
      const m = html.match(/<meta\s+name=["']ct-app-build["']\s+content=["']([^"']+)["']/i);
      const remoteBuild = m && m[1] ? m[1] : '';

      if(!remoteBuild || remoteBuild === BUILD) return;
      if(sessionStorage.getItem('CT_LAST_RELOAD_BUILD') === remoteBuild) return;

      sessionStorage.setItem('CT_LAST_RELOAD_BUILD', remoteBuild);
      location.replace(
        base + '?ctv=' + encodeURIComponent(remoteBuild) + '&t=' + Date.now()
      );
    }catch(e){
      console.warn('CT app update check failed', e);
    }
  }

  setTimeout(checkUpdate, 700);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) setTimeout(checkUpdate, 250);
  });
})();
</script>

  if(!el||el.nodeType!==1)return;

  document.addEventListener('click',e=>{if(e.target?.id==='auto'&&window.__CT_CLOUD_LOCKED_175){e.preventDefault();e.stopImmediatePropagation();openModal();setStatus('⚠️ 這台目前不是主裝置。先按「下載雲端並接管」再繼續爬塔。','warn')}},true);

  document.addEventListener('visibilitychange',()=>{if(document.hidden){return}else if(cloudStarted&&session)smartSync(false).catch(()=>{})},false);
  const oldStart=window.start;if(typeof oldStart==='function')window.start=function(){if(window.__CT_CLOUD_LOCKED_175){openModal();setStatus('⚠️ 另一裝置正在使用雲端存檔，這台已鎖定。','warn');return}return oldStart.apply(this,arguments)};
 }
 async function activateCloud(){
  if(cloudStarted||cloudStarting)return;
  cloudStarting=true;
  try{
   authLoad();
   if(!session){cloudStarted=true;setButton('', '☁️ 雲端');return}
   setButton('cloudGood','☁️ 連線中');setStatus('已登入，正在檢查雲端存檔…');
   if(tokenExpired())await refresh();
   if(!session){cloudStarted=true;setButton('', '☁️ 雲端');return}
   await smartSync(false);
   if(session){cloudStarted=true;startCloudTimers()};
   cloudStarted=true;
  }catch(e){
   console.warn('CT177 cloud activation',e);cloudStarted=true;setButton('cloudBad','☁️ 同步離線');setStatus('⚠️ 雲端暫時無法連線；爬塔本體仍可正常使用。','warn');
  }finally{cloudStarting=false}
 }
 function boot(){
  try{installUI();authLoad();setButton(session?'cloudGood':'',session?'☁️ 已登入':'☁️ 雲端')}catch(e){console.warn('CT177 cloud UI boot',e)}
  // Do not contact Supabase during initial page render. First real user gesture activates cloud safely.
  document.addEventListener('pointerdown',()=>{activateCloud().catch(()=>{})},{once:true,capture:true,passive:true});
  document.addEventListener('keydown',()=>{activateCloud().catch(()=>{})},{once:true,capture:true});
 }
 window.__CT_CLOUD_175={open:openModal,activate:activateCloud,smartSync,upload:uploadCloud,download:downloadCloud,refresh:refreshCloud};
