function charMetaV173(){
  // V17.4.112：角色評級直接使用畫面可見的「個人戰力」數字：10*craw(c)/initialTop。
  // 因此畫面 20.00+ 就是 U 絕對門檻；50.00+ 且全服第1才可 X。
  let a=Object.values(R).flat().map(c=>({id:c.id,power:10*craw(c)/initialTop})).sort((x,y)=>y.power-x.power||String(x.id).localeCompare(String(y.id),'zh-Hant'));
  const n=a.length,EPS=1e-9;
  a.forEach((x,i)=>x.rank=i+1);
  for(let i=0;i<n;){
    let j=i+1;while(j<n&&Math.abs(a[j].power-a[i].power)<=EPS)j++;
    const avgRank=((i+1)+j)/2,pr=n>1?100*(n-avgRank)/(n-1):100;
    for(let k=i;k<j;k++)a[k].pr=Math.max(0,Math.min(100,pr));
    i=j;
  }
  for(const x of a){const pr=x.pr;x.tier=pr>=95?'S':pr>=85?'A':pr>=70?'B':pr>=50?'C':pr>=30?'D':pr>=15?'E':pr>=5?'F':'Z'}
  if(a[0]&&a[0].power>=50&&(!a[1]||a[0].power>a[1].power))a[0].tier='X';
  let uCount=0;
  for(const x of a){
    if(uCount>=3)break;
    if(x.tier==='X')continue;
    if(x.power>=20){x.tier='U';uCount++;}
    else break;
  }
  return Object.fromEntries(a.map(x=>[x.id,x]));
}

 let attempts=0,success=0,failed=0,highest=null,safety=0;
 const made=[];
 for(const tier of TASC.slice(0,-1)){
  const next=TNEXT[tier];if(!next)continue;
  while(safety++<5000){
   const pool=TINV.filter(x=>x.city===city&&x.tier===tier&&!x.equippedTo);
   if(pool.length<5)break;
   attempts++;
   const used=pool.slice(0,5),ids=new Set(used.map(x=>x.id));
   TINV=TINV.filter(x=>!ids.has(x.id));
   if(Math.random()<TFUSE[tier]){
    const it=tNew(city,next,'一鍵5合1合成',0);made.push(it);success++;highest=!highest||TASC.indexOf(next)>TASC.indexOf(highest)?next:highest;
   }else failed++;
  }
 }
 if(!attempts){tToast({type:'core',tier:'Z',name:'目前沒有可5合1的未裝備寶物',city,origin:'一鍵合成',floor:0},'⚡ 一鍵合成');return}
 if(TAUTO)tAutoEquip(city,true);else tSyncCity(city);
 tSave();
 const tier=highest||'Z';
 tToast({type:'core',tier,name:`完成 ${attempts} 次｜成功 ${success}｜失敗 ${failed}`,city,origin:'一鍵合成全部可合素材',floor:0},'⚡ 一鍵合成完成');
 tRenderModal();
}
function tRankLabel(type,r){if((type||'').includes('Boss'))return r===1?'MVP討伐王':r===2?'次席戰功':r===3?'第三戰功':r<=8?'核心討伐隊':r<=16?'主力討伐隊':'支援討伐隊';return r===1?'總冠軍':r===2?'亞軍':r===3?'季軍':r<=8?'八強菁英':r<=16?'晉級組':'聯賽席位'}

// Apply treasure stats on top of the repaired character system.
const BASE_CSTATS_T=window.cstats;
window.cstats=function(c){
 const s=BASE_CSTATS_T(c),items=tForCharAll(c);if(!items.length)return s;
 for(const it of items){
  if(it.tier==='X'){
   const x=XFX[it.type];
   if(it.type==='blade'){s.atk=Math.round(s.atk*(1+x.atk/100));s.crit+=x.crit/100}
   else if(it.type==='shield'){s.hp=Math.round(s.hp*(1+x.hp/100));s.def=Math.round(s.def*(1+x.def/100))}
   else if(it.type==='wing'){s.speed*=1+x.speed/100;s.crit+=x.crit/100}
   else if(it.type==='core'){s.hp=Math.round(s.hp*(1+x.hp/100));s.atk=Math.round(s.atk*(1+x.atk/100));s.def=Math.round(s.def*(1+x.def/100))}
   else if(it.type==='sigil'){s.crit+=x.crit/100;s.speed*=1+x.speed/100}
   continue;
  }
  const v=TPWR[it.tier];
  if(it.type==='blade'){s.atk=Math.round(s.atk*(1+v));s.crit+=v*.12}
  else if(it.type==='shield'){s.hp=Math.round(s.hp*(1+v*.80));s.def=Math.round(s.def*(1+v*.70))}
  else if(it.type==='wing'){s.speed*=1+v*.45;s.crit+=v*.09}
  else if(it.type==='core'){s.hp=Math.round(s.hp*(1+v*.55));s.atk=Math.round(s.atk*(1+v*.55));s.def=Math.round(s.def*(1+v*.45))}
  else if(it.type==='sigil'){s.crit+=v*.14;s.speed*=1+v*.25}
 }
 s.speed=tclamp(s.speed,4,85);s.crit=tclamp(s.crit,.02,.82);return s
};

// Treasure combat effects.
const PREV_HIT_T=window.hit;
window.hit=function(s,p){
 const c=R[s.city].find(x=>x.id===p.id),items=tForCharAll(c),before=s.enemy.hp,crit0=c.crits||0;
 let killed=PREV_HIT_T(s,p);if(!items.length||killed||s.enemy.hp<=0)return killed;
 const baseDmg=Math.max(1,before-s.enemy.hp);let extra=0,labels=[];
 for(const it of items){
  if(it.type==='blade'&&['S','U','X'].includes(it.tier)){
   const chance=it.tier==='S'?.08:it.tier==='U'?.14:.25,m=it.tier==='S'?.30:it.tier==='U'?.55:.90;
   if(Math.random()<chance){extra+=Math.max(1,Math.round(baseDmg*m));labels.push(it.tier==='X'?'🌟創世追擊':it.tier==='U'?'💗至尊追擊':'🔥神兵追擊')}
  }
  if(it.type==='sigil'&&(c.crits||0)>crit0&&['S','U','X'].includes(it.tier)){
   const chance=it.tier==='S'?.10:it.tier==='U'?.18:.35,m=it.tier==='S'?.35:it.tier==='U'?.65:1.10;
   if(Math.random()<chance){extra+=Math.max(1,Math.round(baseDmg*m));labels.push(it.tier==='X'?'📖命運重寫':it.tier==='U'?'🔮因果追加':'✨萬象秘術')}
  }
  if(it.type==='wing'&&['S','U','X'].includes(it.tier)){
   const every=it.tier==='S'?6:it.tier==='U'?5:4,push=it.tier==='S'?18:it.tier==='U'?35:60;
   if(c.attacks%every===0){p.g=Math.max(0,p.g+push);log(s,`🪽 ${it.name}｜攻擊條 +${push}`)}
  }
 }
 if(extra>0){s.enemy.hp=Math.max(0,s.enemy.hp-extra);log(s,`${labels.join('＋')}｜寶物追加 -${extra}`);if(s.enemy.hp<=0){c.kills++;const k=XP_K[s.enemy.key]||12;gain(c,k);log(s,`🎯 ${c.name} 寶物追加擊殺｜EXP +${k}`);killed=true}}
 return killed
};
const PREV_EHIT_T=window.ehit;
window.ehit=function(s){
 let living=s.party.filter(p=>p.alive);if(!living.length)return;
 let p=living[Math.floor(Math.random()*living.length)],c=R[s.city].find(x=>x.id===p.id),items=tForCharAll(c),shields=items.filter(x=>x.type==='shield');
 const dst=cstats(c);p.dodge=dst.dodge;p.critDmg=dst.critDmg;if(Math.random()<(dst.dodge||0)){log(s,`💨 ${p.name} 閃避怪物攻擊`);return}
 let mult=1;for(const it of shields){const r=it.tier==='S'?.08:it.tier==='U'?.18:it.tier==='X'?.35:0;mult*=1-r}
 let dmg=Math.max(1,Math.round(s.enemy.atk*2*100/(100+p.def)*rnd(.85,1.15)*mult));p.hp=Math.max(0,p.hp-dmg);
 const revive=shields.filter(x=>x.tier==='U'||x.tier==='X').sort((a,b)=>TASC.indexOf(b.tier)-TASC.indexOf(a.tier))[0];
 if(!p.hp&&revive&&!p.tGuardUsed){p.tGuardUsed=true;p.hp=Math.max(1,Math.round(p.max*(revive.tier==='X'?.35:.15)));p.alive=true;log(s,`${revive.tier==='X'?'🌟 創世神域':'💗 不滅城'}｜致命傷逆轉，回復 ${Math.round(100*p.hp/p.max)}% HP`)}
 else if(!p.hp){p.alive=false;log(s,'☠️ '+p.name+' 被擊倒')}
};

  let fastToken=0, autoTapWasRunning=false, settleTimer=0;

  function settleAfterStop(){
    clearTimeout(settleTimer);
    settleTimer=setTimeout(()=>{
      if(!running){

        try{save(true)}catch(e){}
      }
    },120);
  }

  function fastStop(){
    running=false;
    fastToken++;
    if(raf)cancelAnimationFrame(raf);
    raf=0;
    if(autoBtn)autoBtn.textContent='▶ 自動';
  }

  function fastLoop(ts){
    if(!running)return;
    const token=fastToken;
    const sp=+$('speed').value;
    const ms=1000/sp;
    const dt=Math.min(sp>=25?80:sp>=10?100:160,Math.max(0,ts-last));
    last=ts;
    acc+=dt;
    const maxBatch=sp>=25?2:sp>=10?3:sp>=5?4:6;
    let n=Math.min(maxBatch,Math.floor(acc/ms));
    for(let i=0;i<n;i++){
      if(!running||token!==fastToken)break;
      tick(false);
      acc=Math.max(0,acc-ms);
    }
    const paintEvery=sp>=25?240:sp>=10?190:sp>=5?180:850;
    if(n>0&&running&&token===fastToken&&(ts-lastPaint>=paintEvery)){
      render();
      lastPaint=ts;
    }
    if(running&&token===fastToken)raf=requestAnimationFrame(fastLoop);
  }

    if(running){fastStop();settleAfterStop();return}

    window.__CT_RESUME_WANTED=false;
    fastToken++;
    if(autoBtn)autoBtn.textContent='⏸ 暫停';
    last=performance.now();acc=0;lastPaint=0;
    raf=requestAnimationFrame(fastLoop);
  }

  window.loop=fastLoop;
  window.start=fastStart;
  window.stop=()=>{fastStop();settleAfterStop()};

      if(autoTapWasRunning)fastStop();

    autoBtn.addEventListener('pointercancel',()=>autoBtn.classList.remove('tapNow'),{passive:true});

      e.preventDefault();
      if(autoTapWasRunning){autoTapWasRunning=false;settleAfterStop();return}
      fastStart();
    });
  }

  if(resetBtn){
    resetBtn.addEventListener('pointerdown',()=>{
      resetBtn.classList.add('tapNow');
      if(running)fastStop();

    resetBtn.addEventListener('pointerup',()=>resetBtn.classList.remove('tapNow'),{passive:true});
    resetBtn.addEventListener('pointercancel',()=>resetBtn.classList.remove('tapNow'),{passive:true});
  }

  document.querySelectorAll('.controls button').forEach(btn=>{
    if(btn===autoBtn||btn===resetBtn)return;
    btn.addEventListener('pointerdown',()=>btn.classList.add('tapNow'),{passive:true});
    btn.addEventListener('pointerup',()=>btn.classList.remove('tapNow'),{passive:true});
    btn.addEventListener('pointercancel',()=>btn.classList.remove('tapNow'),{passive:true});
  });
})();

  const back=document.getElementById('reset1747Back');

  function hardStop(){
    try{ if(typeof window.stop==='function') window.stop(); }
    catch(e){ try{running=false;if(raf)cancelAnimationFrame(raf);raf=0}catch(_){} }
    try{running=false}catch(e){}

  }

    opening=true;
    fresh.classList.add('reset1747Touch');
    hardStop();
    back.classList.add('open');
    requestAnimationFrame(()=>{opening=false;fresh.classList.remove('reset1747Touch')});
  }
  function closeReset(e){if(e){e.preventDefault();e.stopPropagation()}back.classList.remove('open')}
  function doReset(e){
    if(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation()}
    hardStop();
    yes.disabled=true; yes.textContent='重新建立中…';

      localStorage.removeItem(SAVE);

      save(true);
      render();
      back.classList.remove('open');
    }catch(err){
      console.error('hard reset failed',err);
      alert('新遊戲初始化失敗：'+(err&&err.message?err.message:err));
    }finally{
      yes.disabled=false;yes.textContent='確定開新遊戲';
    }
  }

  // pointerdown is intentionally used for immediate iPad response.
  fresh.addEventListener('pointerdown',openReset,{capture:true});

  fresh.addEventListener('click',openReset,{capture:true});
  fresh.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){openReset(e)}});
  no.addEventListener('pointerdown',closeReset,{capture:true});
  no.addEventListener('click',closeReset,{capture:true});
  yes.addEventListener('pointerdown',doReset,{capture:true});
  yes.addEventListener('click',doReset,{capture:true});
  back.addEventListener('pointerdown',e=>{if(e.target===back)closeReset(e)},{capture:true});
})();

<script id="ct174107LogicOnlyPatch">
(()=>{
  'use strict';
  window.__CT_BUILD='V17.4.107-logic-only-keep-visuals';

  // ===== 1) Team same-floor ranking: compare power first, then enemy HP% =====
  window.rank = rank = function(){
    let m=meta();
    return [...states].sort((a,b)=>b.floor-a.floor || m[b.city].power-m[a.city].power || a.enemy.hp/a.enemy.max-b.enemy.hp/b.enemy.max);
  };

  // V17.4.124: battle treasure slots are part of the authoritative card render itself.
  function ctBattleTreasureInline124(c){
    try{
      const api=window.__CT_TREASURE;
      if(!api||typeof api.itemsForChar!=='function'||!c)return '';
      const items=api.itemsForChar(c)||[];
      const names={X:'創世',U:'至尊',S:'神話',A:'傳說',B:'史詩',C:'稀有',D:'精良',E:'優良',F:'普通',Z:'凡品'};
      const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const slots=[0,1,2,3,4].map(i=>{
        const it=items[i];
        if(!it)return '<span class="tBattleSlot empty" title="空寶物槽">◇</span>';
        let img='',effect='';
        try{img=typeof api.svg==='function'?api.svg(it.type,it.tier):''}catch(e){}
        try{effect=typeof api.effect==='function'?api.effect(it.tier,it.type):''}catch(e){}
        const title=esc([it.tier+' '+(names[it.tier]||it.tier),it.name,effect].filter(Boolean).join('｜'));
        return `<span class="tBattleSlot ${it.tier}" title="${title}"><img src="${img}"><i><span class="tierLetter tierMotion ${it.tier}">${it.tier}</span></i></span>`;
      }).join('');
      return `<div class="tBattleTreasureStrip"><span class="tBattleTreasureLabel">寶物</span>${slots}</div>`;
    }catch(e){console.warn('CT124 inline treasure',e);return ''}
  }

  // ===== 2) Persistent render to avoid resetting rating/name animations every repaint =====
  window.render = render = function(){
    let m=meta(), rr=rank(), lead=rr[0], sel=states.find(x=>x.city===selected)||rr[0];
    $('kt').textContent=turn;
    $('kl').textContent=lead.city.replace(/[縣市]$/,'');
    $('kf').textContent=lead.floor+'F';

    const kr=$('kr'), selTier=m[sel.city].tier;
    let krTier=kr && kr.querySelector('.tierMotion');
    if(kr && !krTier){
      krTier=document.createElement('span');
      krTier.className='tier tierLetter tierMotion '+selTier;
      krTier.textContent=selTier;
      krTier.dataset.tier=selTier;
      kr.replaceChildren(krTier);
    }
    if(krTier && krTier.dataset.tier!==selTier){
      krTier.className='tier tierLetter tierMotion '+selTier;
      krTier.textContent=selTier;
      krTier.dataset.tier=selTier;
    }

    const kp=$('kp');
    if(kp){
      const pv=m[sel.city].power.toFixed(2);
      if(kp.textContent!==pv)kp.textContent=pv;
      if(kp.dataset.tier!==selTier){kp.className='ratingText '+selTier;kp.dataset.tier=selTier;}
    }

    const tb=$('rank');
    const oldRows=new Map([...tb.querySelectorAll('tr.team')].map(tr=>[tr.dataset.city,tr]));
    const rows=[];
    rr.forEach((s,i)=>{
      const tier=m[s.city].tier;
      let tr=oldRows.get(s.city), isNew=false;
      if(!tr){
        isNew=true;
        tr=document.createElement('tr');
        tr.className='team';
        tr.dataset.city=s.city;
        tr.innerHTML='<td></td><td><div class="city"></div><div class="sub"></div></td><td class="rankTierCell"><span class="rankTierAnchor"><span class="tier tierLetter tierMotion"></span></span></td><td></td><td><b></b><div class="sub"></div></td><td></td><td></td>';
        tr.onclick=()=>{selected=tr.dataset.city;render();};
      }
      tr.classList.toggle('sel',s.city===selected);
      if(tr.children[0].textContent!==String(i+1))tr.children[0].textContent=i+1;
      const teamCell=tr.children[1], tierNode=tr.children[2].querySelector('.tierMotion'), powCell=tr.children[3];
      if(isNew){
        teamCell.querySelector('.city').textContent=s.city;
        teamCell.querySelector('.sub').textContent=TEAMN[s.city]||'';
      }
      if(tr.dataset.tier!==tier){
        tr.dataset.tier=tier;
        teamCell.className='teamTint '+tier;
        tierNode.className='tier tierLetter tierMotion '+tier;
        tierNode.textContent=tier;
        tierNode.dataset.tier=tier;
        powCell.className='powerTint '+tier;
        powCell.dataset.tier=tier;
      }
      const ptxt=m[s.city].power.toFixed(2);
      if(powCell.textContent!==ptxt)powCell.textContent=ptxt;
      const floorCell=tr.children[4];
      floorCell.querySelector('b').textContent=s.floor+'F';
      floorCell.querySelector('.sub').textContent=s.ft+'T｜敵剩'+Math.round(s.enemy.hp/s.enemy.max*100)+'%';
      tr.children[5].innerHTML='<div class="partyMini">'+s.party.map(p=>`<div><div class="miniName">${p.name} Lv.${R[s.city].find(c=>c.id===p.id).lv}</div><div class="bar"><i style="width:${100*p.hp/p.max}%"></i></div><div class="sub">${Math.round(p.hp)}/${p.max}｜⚡ ${Math.round(p.g)}/100</div><div class="miniGauge17425" aria-label="攻擊條"><i style="width:${Math.max(0,Math.min(100,Number(p.g)||0))}%"></i></div></div>`).join('')+'</div>';
      {const ep=Math.max(0,Math.min(100,100*s.enemy.hp/Math.max(1,s.enemy.max)));tr.children[6].innerHTML=`<div class="rankEnemy174"><div class="reh174top"><span>${Math.round(s.enemy.hp)} / ${s.enemy.max}</span><span>${Math.round(ep)}%</span></div><div class="reh174track"><div class="reh174fill" style="width:${ep}%"></div></div></div>`;}
      rows.push(tr);
      oldRows.delete(s.city);
    });
    oldRows.forEach(tr=>tr.remove());
    let anchor=tb.firstElementChild;
    for(const tr of rows){
      if(tr!==anchor)tb.insertBefore(tr,anchor);
      anchor=tr.nextElementSibling;
    }

    let e=sel.enemy;
    $('arena').innerHTML=`<div class="enemy"><div class="cardTop"><div><b>${e.name}</b><div class="sub">ATK ${e.atk.toFixed(0)}｜DEF ${e.def.toFixed(0)}｜攻速 ${e.speed.toFixed(1)}</div></div><b>${Math.round(e.hp)} / ${e.max}</b></div><div class="monsterHp174"><div class="mh174top"><span>❤️ 怪物 HP</span><span class="mh174num">${Math.round(e.hp)} / ${e.max}</span></div><div class="mh174track"><div class="mh174fill" style="width:${Math.max(0,Math.min(100,100*e.hp/e.max))}%"></div></div><div class="mh174pct">剩餘 ${Math.round(Math.max(0,Math.min(100,100*e.hp/e.max)))}%</div></div><div class="gbar" style="margin-top:5px"><i style="width:${e.g}%"></i></div></div><div class="cards">${sel.party.map(p=>{let c=R[sel.city].find(x=>x.id===p.id);return `<div class="card ${p.alive?'':'dead'}"><div class="cardTop"><div><div class="name">${p.name}</div></div><b>${Math.round(p.hp)}/${p.max}</b></div><div class="ctExpRowFinal"><span class="ctLvFinal">Lv.${c.lv}</span><span class="ctExpValueFinal">EXP ${c.xp}/${xpNeed(c.lv)}</span></div><div class="xp173" aria-label="EXP進度"><i style="width:${Math.max(0,Math.min(100,100*c.xp/xpNeed(c.lv)))}%"></i></div><div class="bar"><i style="width:${100*p.hp/p.max}%"></i></div><div class="gbar" style="margin-top:5px"><i style="width:${p.g}%"></i></div>${window.ctBattleTreasureInline126(c)}<div class="stats"><div class="stat">ATK<b>${p.atk}</b></div><div class="stat">DEF<b>${p.def}</b></div><div class="stat">攻速<b>${p.speed.toFixed(1)}</b></div><div class="stat">爆擊<b>${Math.round(p.crit*100)}%</b></div><div class="stat">閃避<b>${Math.round((p.dodge||0)*100)}%</b></div><div class="stat">爆傷<b>+${Math.round((p.critDmg||.50)*100)}%</b></div></div></div>`}).join('')}</div>`;
    const battleLogEl=$('log')||$('battlelog');
    if(battleLogEl) battleLogEl.innerHTML='<div class="sub">'+sel.city+'｜'+(TEAMN[sel.city]||'')+'</div>'+sel.log.slice(0,18).map(x=>'<div>'+x+'</div>').join('');
  };

  // ===== 3) Team tier thresholds kept but widened as latest logic =====
  window.meta = meta = function(){
    let a=Object.keys(R).map(city=>({city,power:10*teamRaw(city)/initialTop})).sort((x,y)=>y.power-x.power);
    a.forEach((x,i)=>x.rank=i+1);
    for(const x of a){let v=x.power,r=x.rank;x.tier=v>=9&&r<=3?'S':v>=8&&r<=7?'A':v>=7&&r<=11?'B':v>=6&&r<=15?'C':v>=4.5&&r<=18?'D':v>=4?'E':'F'}
    if(a[0]&&a[1]&&a[0].power>=20&&a[0].power>=a[1].power*1.12)a[0].tier='U';
    else if(a[1]&&a[2]&&a[1].power>=20&&a[1].power>=a[2].power*1.12)a[1].tier='U';
    if(a[0]&&a[1]&&a[0].power>=50&&a[0].power>=a[1].power*1.25)a[0].tier='X';
    let z=a[a.length-1],p=a[a.length-2];if(z&&p&&z.power<3.3&&z.power<=p.power*.92)z.tier='Z';
    return Object.fromEntries(a.map(x=>[x.city,x]));
  };

  // ===== 4) Character tiers use PR; U up to 3, X unique =====
  window.charMeta = function charMetaV174(){
    // V17.4.112：與角色資料頁顯示的「個人戰力」完全同一把尺。
    let a=Object.values(R).flat().map(c=>({id:c.id,power:10*craw(c)/initialTop})).sort((x,y)=>y.power-x.power||String(x.id).localeCompare(String(y.id),'zh-Hant'));
    const n=a.length, EPS=1e-9;
    a.forEach((x,i)=>x.rank=i+1);
    for(let i=0;i<n;){
      let j=i+1;while(j<n && Math.abs(a[j].power-a[i].power)<=EPS)j++;
      const avgRank=((i+1)+j)/2, pr=n>1?100*(n-avgRank)/(n-1):100;
      for(let k=i;k<j;k++)a[k].pr=Math.max(0,Math.min(100,pr));
      i=j;
    }
    for(const x of a){const pr=x.pr;x.tier=pr>=95?'S':pr>=85?'A':pr>=70?'B':pr>=50?'C':pr>=30?'D':pr>=15?'E':pr>=5?'F':'Z';}
    if(a[0] && a[0].power>=50 && (!a[1] || a[0].power>a[1].power))a[0].tier='X';
    let uCount=0;
    for(const x of a){
      if(uCount>=3)break;
      if(x.tier==='X')continue;
      if(x.power>=20){x.tier='U';uCount++;} else break;
    }
    return Object.fromEntries(a.map(x=>[x.id,x]));
  };

  // ===== 5) Warm-up: 1~300F slower monster growth =====
  function warmupMul(f){
    f=Math.max(1,Number(f)||1);
    if(f<=100)return 0.35;
    if(f<=200)return 0.35+(f-100)/100*0.15;
    if(f<=250)return 0.50+(f-200)/50*0.15;
    if(f<=300)return 0.65+(f-250)/50*0.15;
    return 1;
  }
  const PREV_ENEMY = window.enemy;
  window.enemy = enemy = function(f,fails=0){
    const e = PREV_ENEMY(f,fails), w = warmupMul(f);
    if(f<=300){
      e.max=Math.max(1,Math.round(e.max*w));
      e.hp=e.max;
      const aw=0.58+0.42*w, dw=0.62+0.38*w;
      e.atk=Math.max(1,e.atk*aw);
      e.def=Math.max(0,e.def*dw);
      e.warmup=w;
    }
    return e;
  };
  try{
    for(const s of states||[]){
      if(!s || !s.enemy || s.floor>300)continue;
      const pct=s.enemy.max?Math.max(0,Math.min(1,s.enemy.hp/s.enemy.max)):1, g=s.enemy.g||0;
      const n=enemy(s.floor,s.failsAtFloor||0); n.hp=Math.round(n.max*pct); n.g=g; s.enemy=n;
    }
  }catch(e){console.warn('warm-up migrate',e);}

  // ===== 6) Team rating growth on future level-ups =====
  const TEAM_LV_GROWTH={Z:{atk:15,hp:10},F:{atk:16,hp:11},E:{atk:17,hp:12},D:{atk:18,hp:13},C:{atk:19,hp:14},B:{atk:21,hp:15},A:{atk:24,hp:17},S:{atk:28,hp:20},U:{atk:38,hp:27},X:{atk:55,hp:40}};
  const PREV_CSTATS = window.cstats;
  window.cstats = cstats = function(c){
    const st=PREV_CSTATS(c);
    st.atk=Math.max(1,Math.round(st.atk+(Number(c.ctAtkGrowth)||0)));
    st.hp=Math.max(1,Math.round(st.hp+(Number(c.ctHpGrowth)||0)));
    return st;
  };
  function teamTierNow(city){ try{return meta()[city]?.tier||'Z';}catch(e){return 'Z';} }
  window.gain = gain = function(c,n){
    c.xp=(Number(c.xp)||0)+(Number(n)||0);
    while(c.xp>=xpNeed(c.lv) && c.lv<200){
      const tier=teamTierNow(c.city), g=TEAM_LV_GROWTH[tier]||TEAM_LV_GROWTH.Z;
      c.xp-=xpNeed(c.lv); c.lv++;
      c.ctAtkGrowth=(Number(c.ctAtkGrowth)||0)+g.atk;
      c.ctHpGrowth=(Number(c.ctHpGrowth)||0)+g.hp;
    }
  };

  // ===== 7) Genesis catch-up damage and rating EXP bonus =====
  const ROLE_XP={Z:2,F:3,E:4,D:5,C:6,B:8,A:10,S:13,U:18,X:25};
  function genesisInfo(){
    let xCity=null,xFloor=0;
    try{
      const mm=meta();
      for(const city of Object.keys(mm))if(mm[city]?.tier==='X'){xCity=city;break;}
      if(xCity){const xs=states.find(z=>z.city===xCity);xFloor=xs?.floor||0;}
    }catch(e){}
    return {xCity,xFloor};
  }
  function genesisDmgMul(city){
    const g=genesisInfo();
    if(!g.xCity || city===g.xCity)return 1;
    const s=states.find(z=>z.city===city), gap=Math.max(0,g.xFloor-(s?.floor||0));
    if(gap<25)return 1;
    if(gap<50)return 1.03;
    if(gap<100)return 1.06;
    if(gap<200)return 1.10;
    if(gap<400)return 1.15;
    if(gap<700)return 1.20;
    return 1.25;
  }
  const PREV_HIT = window.hit;
  window.hit = hit = function(s,p){
    let c=R[s.city].find(x=>x.id===p.id);
    if(!c)return PREV_HIT(s,p);

        }
      }
    }

  };

<script id="ct174127StatsRecalc">

const DODGE_BY_TIER={Z:.005,F:.010,E:.015,D:.020,C:.030,B:.040,A:.060,S:.090,U:.140,X:.200};
const CRITDMG_BY_TIER={Z:.02,F:.03,E:.05,D:.07,C:.10,B:.15,A:.22,S:.35,U:.55,X:.90};
const XFX127={blade:{atk:220,crit:25},shield:{hp:175,def:155},wing:{speed:100,crit:20},core:{hp:120,atk:120,def:100},sigil:{crit:30,speed:55}};

function items127(c){
  try{return window.__CT_TREASURE?.itemsForChar?.(c)||[]}catch(e){return[]}
}
function rawBase127(c,baseOnly=false){
  const n=baseOnly?0:Math.max(0,(Number(c.lv)||1)-1),g=baseOnly?1:1+(Number(c.bonus)||0);
  return {
    hp:Math.max(1,Math.round((Number(c.hp)||1)*10*(1+n*.0130)*g)),
    atk:Math.max(1,Math.round((Number(c.atk)||1)*(1+n*.0120)*g)),
    def:Math.max(0,Math.round((Number(c.def)||0)*(1+n*.0108)*g)),
    speed:Math.max(4,8+((Number(c.mob)||50)-50)/150*16+n*.055),
    crit:Math.max(.02,.05+((Number(c.tech)||50)-50)/150*.18+n*.00055),
    dodge:Math.max(.02,.03+((Number(c.mob)||50)-50)/150*.24+n*.00040),
    critDmg:Math.max(.50,.50+((Number(c.tech)||50)-50)/150*.45+n*.00150)
  };
}
function applyTreasure127(s,c){
  const seen=new Set();
  for(const it of items127(c)){
    if(!it||seen.has(it.type))continue; seen.add(it.type);
    if(it.tier==='X'){
      const x=XFX127[it.type]||{};
      if(it.type==='blade'){s.atk*=1+(x.atk||0)/100;s.crit+=(x.crit||0)/100}
      else if(it.type==='shield'){s.hp*=1+(x.hp||0)/100;s.def*=1+(x.def||0)/100}
      else if(it.type==='wing'){s.speed*=1+(x.speed||0)/100;s.crit+=(x.crit||0)/100;s.dodge+=(DODGE_BY_TIER.X||0)}
      else if(it.type==='core'){s.hp*=1+(x.hp||0)/100;s.atk*=1+(x.atk||0)/100;s.def*=1+(x.def||0)/100}
      else if(it.type==='sigil'){s.crit+=(x.crit||0)/100;s.speed*=1+(x.speed||0)/100;s.critDmg+=(CRITDMG_BY_TIER.X||0)}

    }

    if(it.type==='blade'){s.atk*=1+v;s.crit+=v*.12}
    else if(it.type==='shield'){s.hp*=1+v*.80;s.def*=1+v*.70}
    else if(it.type==='wing'){s.speed*=1+v*.45;s.crit+=v*.09;s.dodge+=(DODGE_BY_TIER[it.tier]||0)}
    else if(it.type==='core'){s.hp*=1+v*.55;s.atk*=1+v*.55;s.def*=1+v*.45}
    else if(it.type==='sigil'){s.crit+=v*.14;s.speed*=1+v*.25;s.critDmg+=(CRITDMG_BY_TIER[it.tier]||0)}

}
function finalize127(s,c,baseOnly=false){
  if(!baseOnly){

  // Every 10% crit-damage above 500% -> +1% ATK and +1 speed.

<!-- CT U-after-X + monotonic leaderboard power fix -->
<script>
(()=>{
  'use strict';

  function ctRawTeamPowerMap(){
    const out={};
    for(const city of Object.keys(R||{})){
      out[city]=10*teamRaw(city)/Math.max(1e-9,Number(initialTop)||1);
    }
    return out;
  }

  function ctProgressRank(raw){
    return [...(states||[])].sort((a,b)=>{
      const af=Number(a?.floor)||0, bf=Number(b?.floor)||0;
      if(bf!==af)return bf-af;
      const ar=(Number(a?.enemy?.hp)||0)/Math.max(1,Number(a?.enemy?.max)||1);
      const br=(Number(b?.enemy?.hp)||0)/Math.max(1,Number(b?.enemy?.max)||1);
      if(Math.abs(ar-br)>1e-12)return ar-br;
      const ap=Number(raw[a?.city])||0, bp=Number(raw[b?.city])||0;
      if(Math.abs(bp-ap)>1e-12)return bp-ap;
      return String(a?.city||'').localeCompare(String(b?.city||''),'zh-Hant');
    });
  }

  function ctTwo(x){ return Math.round((Number(x)||0)*100)/100; }

  // 排名仍以樓層/當層進度為主；戰力指數則保證由上往下嚴格不增加。
  window.meta = meta = function(){
    const raw=ctRawTeamPowerMap();
    const rr=ctProgressRank(raw);
    const a=[];
    let prev=Infinity;

    rr.forEach((s,i)=>{
      const rawPower=ctTwo(raw[s.city]);
      let power;
      if(i===0){
        power=rawPower;
      }else{
        const ceiling=ctTwo(prev-0.01);
        power=Math.min(rawPower,ceiling);
      }
      power=Math.max(0,power);
      prev=power;
      a.push({city:s.city,power,rawPower,rank:i+1,tier:'F'});
    });

    // 基礎評級先依「排名後的戰力指數」判定。
    for(const x of a){
      const v=x.power,r=x.rank;
      x.tier=v>=9&&r<=3?'S':v>=8&&r<=7?'A':v>=7&&r<=11?'B':v>=6&&r<=15?'C':v>=4.5&&r<=18?'D':v>=4?'E':'F';
    }

    // 先決定唯一 X。
    if(a[0] && a[1] && a[0].power>=50 && a[0].power>=a[1].power*1.25){
      a[0].tier='X';
    }

    // 再從「非 X」隊伍往下找一個 U；因此 X 不會再把 U 名額吃掉。
    const nonX=a.filter(x=>x.tier!=='X');
    for(let i=0;i<nonX.length-1;i++){
      const cur=nonX[i], next=nonX[i+1];
      if(cur.rank>3)break;
      if(cur.power>=20 && cur.power>=next.power*1.12){
        cur.tier='U';
        break;
      }
    }

    const z=a[a.length-1], p=a[a.length-2];
    if(z&&p&&z.power<3.3&&z.power<=p.power*.92)z.tier='Z';
    return Object.fromEntries(a.map(x=>[x.city,x]));
  };

  // 排名規則保持原本的爬塔進度邏輯，不用 meta() 反過來排序，避免循環與跳動。
  window.rank = rank = function(){
    return ctProgressRank(ctRawTeamPowerMap());
  };
})();
</script>

<!-- CT TIER FX PREVIEW START -->
<style id="ctTierFxPreviewStyle">
#ctTierFxBack{display:none;position:fixed;inset:0;z-index:2600;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:18px}
#ctTierFxBack.open{display:flex}
.ctTierFxModal{width:min(920px,96vw);max-height:92vh;overflow:auto;background:#0f1929;border:1px solid #425c83;border-radius:18px;box-shadow:0 20px 70px #000c;padding:14px}
.ctTierFxHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:-14px;z-index:2;background:#0f1929;padding:10px 0}
.ctTierFxHead b{font-size:18px}.ctTierFxBtns{display:flex;gap:7px;flex-wrap:wrap}
#ctTierFxGrid{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:10px;padding:6px 2px 12px}
.ctTierFxCard{min-height:150px;border:1px solid #2d4264;border-radius:14px;background:#142138;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:visible;padding:16px 8px}
.ctTierFxCard .ctTierFxName{font-size:10px;color:#93a4bf;min-height:15px;text-align:center}
.ctTierFxLetter{display:inline-flex;align-items:center;justify-content:center;width:1.35em;height:1.35em;line-height:1;font-size:52px;font-weight:1000;transform-origin:50% 50%;-webkit-transform-origin:50% 50%;overflow:visible;will-change:transform,filter,text-shadow,opacity}
/* Use the actual current game motions, but keep this preview on its own clock so opening/replaying always starts at cycle 1. */
.ctTierFxLetter.X{animation:ctXFiveCycleBurst 10.5s linear infinite!important;-webkit-animation:ctXFiveCycleBurst 10.5s linear infinite!important}
.ctTierFxLetter.U{animation:ctUFiveCycleFlash 13s linear infinite!important;-webkit-animation:ctUFiveCycleFlash 13s linear infinite!important}
.ctTierFxLetter.S{animation:v108S 3s linear infinite!important;-webkit-animation:v108S 3s linear infinite!important}
.ctTierFxLetter.A{animation:v108A 3s linear infinite!important;-webkit-animation:v108A 3s linear infinite!important}
.ctTierFxLetter.B,.ctTierFxLetter.C,.ctTierFxLetter.D,.ctTierFxLetter.E,.ctTierFxLetter.F,.ctTierFxLetter.Z{animation:none!important;-webkit-animation:none!important}
.ctTierFxCard.X{box-shadow:0 0 18px rgba(255,229,94,.14)}.ctTierFxCard.U{box-shadow:0 0 18px rgba(255,114,212,.12)}
@media(max-width:760px){#ctTierFxGrid{grid-template-columns:repeat(2,minmax(120px,1fr))}.ctTierFxLetter{font-size:46px}}
</style>
<div id="ctTierFxBack" aria-hidden="true">
  <div class="ctTierFxModal" role="dialog" aria-modal="true" aria-label="評級特效預覽">
    <div class="ctTierFxHead">
      <div><b>✨ 評級特效預覽</b><div class="sub">各評級皆依目前遊戲實際效果播放；X／U／S／A 可直接觀看完整呼吸與特殊效果。</div></div>
      <div class="ctTierFxBtns"><button id="ctTierFxReplay">↻ 重播特效</button><button id="ctTierFxClose">✕ 關閉</button></div>
    </div>
    <div id="ctTierFxGrid"></div>
  </div>
</div>
<script id="ctTierFxPreviewScript">
(()=>{
  'use strict';
  const tiers=['X','U','S','A','B','C','D','E','F','Z'];
  const desc={X:'5次呼吸＋3秒創世彩光狂轉',U:'5次皇后呼吸＋3秒皇冠珠寶登場',S:'5次力量呼吸＋1.5秒重擊衝擊波',A:'5秒橘金呼吸＋小型星環綻放',B:'紫色靜態能量光',C:'冷藍靜態微光',D:'柔綠靜態微光',E:'白色普通評級',F:'咖啡色瑕疵評級',Z:'灰色大裂痕評級'};
  const back=document.getElementById('ctTierFxBack');
  const grid=document.getElementById('ctTierFxGrid');
  let focusedTier=null;
  function build(){
    if(!grid)return;
    grid.innerHTML=tiers.map(t=>`<div class="ctTierFxCard ${t}${focusedTier===t?' ctTierFxFocused':''}" data-tier="${t}"><span class="ctTierFxLetter ${t}">${t}</span><div class="ctTierFxName">${desc[t]}</div></div>`).join('');
    if(focusedTier){
      requestAnimationFrame(()=>grid.querySelector(`.ctTierFxCard[data-tier="${focusedTier}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}));
    }
  }
  function open(tier=null){focusedTier=tiers.includes(tier)?tier:null;build();back?.classList.add('open');back?.setAttribute('aria-hidden','false');}
  function close(){back?.classList.remove('open');back?.setAttribute('aria-hidden','true');focusedTier=null;}
  document.getElementById('tierFxPreview')?.addEventListener('click',()=>open(null));
  document.getElementById('ctTierFxReplay')?.addEventListener('click',()=>{grid.innerHTML='';requestAnimationFrame(build);});
  document.getElementById('ctTierFxClose')?.addEventListener('click',close);
  back?.addEventListener('click',e=>{if(e.target===back)close();});
  window.openTierFxPreview=open;
})();
</script>

<!-- CT INDEX TIER CLICK PREVIEW START -->
<style id="ctIndexTierClickPreviewStyle">
/* Main index: rating letters can be tapped to open the real effect preview. */
#kr .tierMotion, #rank .rankTierCell .tierMotion{cursor:pointer;touch-action:manipulation}
#kr .tierMotion:active, #rank .rankTierCell .tierMotion:active{filter:brightness(1.35)}
.ctTierFxCard.ctTierFxFocused{outline:2px solid rgba(255,255,255,.88);outline-offset:3px;box-shadow:0 0 28px currentColor,0 0 50px rgba(255,255,255,.18)}
</style>
<script id="ctIndexTierClickPreviewScript">
(()=>{
  'use strict';
  function openFocusedTier(tier){
    if(typeof window.openTierFxPreview==='function') window.openTierFxPreview(tier);
  }
  document.getElementById('kr')?.addEventListener('click',e=>{
    const el=e.target.closest?.('.tierMotion');
    if(!el)return;
    e.preventDefault();
    e.stopPropagation();
    const tier=(el.textContent||'').trim();
    if(tier)openFocusedTier(tier);
  });
  document.getElementById('rank')?.addEventListener('click',e=>{
    const el=e.target.closest?.('.rankTierCell .tierMotion');
    if(!el)return;
    e.preventDefault();
    e.stopPropagation();
    const tier=(el.textContent||'').trim();
    if(tier)openFocusedTier(tier);
  },true);
})();
</script>

<style id="ctIndexTierLargeTapTargetStyle">

#kr .tierMotion,#rank td.rankTierCell .tierMotion{pointer-events:none!important;}
#rank td.rankTierCell::after,#kr::after{content:"";position:absolute;inset:0;z-index:20;background:transparent;}
</style>
<script id="ctIndexTierLargeTapTargetScript">
(()=>{
  'use strict';
  const openTier=t=>{if(t&&typeof window.openTierFxPreview==='function')window.openTierFxPreview(t)};
  const kr=document.getElementById('kr');
  if(kr){
    kr.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      const t=(kr.querySelector('.tierMotion')?.textContent||kr.textContent||'').trim().slice(0,1);
      openTier(t);
    },true);
  }
  const rank=document.getElementById('rank');
  if(rank){
    rank.addEventListener('click',e=>{
      const cell=e.target.closest?.('td.rankTierCell');
      if(!cell)return;
      e.preventDefault();e.stopImmediatePropagation();
      const t=(cell.querySelector('.tierMotion')?.textContent||'').trim();
      openTier(t);
    },true);
  }
})();
</script>

<script id="ctGlobalAllTierLocationFxScript">
(()=>{
  'use strict';
  const TIERS=new Set(['X','U','S','A','B','C','D','E','F','Z']);
  let decorating=false;

  function markGlyph(el,tier){
    if(!el||!TIERS.has(tier))return;
    el.classList.add('tier','tierLetter','tierMotion','ctGlobalTierGlyph',tier);
  }

  function splitLeadingTier(host){
    if(!host || host.dataset.ctTierSplit==='1')return;
    const raw=(host.textContent||'').trim();
    const tier=raw.slice(0,1);
    if(!TIERS.has(tier))return;
    if(raw.length===1){
      markGlyph(host,tier);
      host.dataset.ctTierSplit='1';
      return;
    }
    /* Only split labels that actually begin with "T｜..." or "T ..." so Chinese text itself stays static. */
    const next=raw.slice(1,2);
    if(next!=='｜' && next!==' ' && next!=='／' && next!=='/'){return;}
    host.classList.add('ctTierSplitHost');
    host.innerHTML=`<span class="tier tierLetter tierMotion ctGlobalTierGlyph ${tier}">${tier}</span><span class="ctTierStaticSuffix">${raw.slice(1)}</span>`;
    host.dataset.ctTierSplit='1';
  }

  function decorate(root=document){
    if(decorating||!root?.querySelectorAll)return;
    decorating=true;
    try{
      /* Existing real tier glyphs. */
      root.querySelectorAll('.tierLetter,.tierMotion,.tierMark17428,.tierWord17434,.ctTierFxLetter').forEach(el=>{
        const t=(el.textContent||'').trim();
        if(TIERS.has(t))markGlyph(el,t);
      });

      /* Raw one-letter grades in character/team data. */
      root.querySelectorAll('.ratingText').forEach(el=>{
        const t=(el.textContent||'').trim();
        if(TIERS.has(t))markGlyph(el,t);
      });

      /* Treasure inventory/catalog grade labels: animate only the letter, not "｜菁英" etc. */
      root.querySelectorAll('.tGrade.ratingText').forEach(splitLeadingTier);

      /* Equipped treasure rows: same rule, only the tier letter moves. */
      root.querySelectorAll('.tRosterEquip b.ratingText').forEach(splitLeadingTier);
    }finally{
      decorating=false;
    }
  }

  decorate(document);
  requestAnimationFrame(()=>decorate(document));

  const mo=new MutationObserver(ms=>{
    for(const m of ms){
      for(const n of m.addedNodes){
        if(n.nodeType===1)decorate(n);
      }
    }
  });
  mo.observe(document.body,{subtree:true,childList:true});

  /* Re-run after views that rebuild DOM. */
  for(const name of ['render','showCities','showRoster','showTreasures','tRender','tRenderCatalog','tRenderModal']){
    const old=window[name];
    if(typeof old!=='function'||old.__ctGlobalTierFxWrapped)continue;
    const wrapped=function(){
      const r=old.apply(this,arguments);
      requestAnimationFrame(()=>decorate(document));
      return r;
    };
    wrapped.__ctGlobalTierFxWrapped=true;
    window[name]=wrapped;
    if(name==='render')window.render=render=wrapped;
    else if(name==='showRoster')window.showRoster=showRoster=wrapped;
  }

  window.__CT_DECORATE_ALL_TIER_GLYPHS=()=>decorate(document);
})();
</script>

<!-- CT TEAM PR RATING SYSTEM START -->
<script id="ctTeamPRRatingSystem">
(()=>{
  'use strict';

  /*
    Team rating:
    - X: max 1 team, only current #1 by team power, absolute power >= 50,
         and >= 25% above #2.
    - U: max 1 team, only the strongest non-X team, absolute power >= 20,
         and >= 12% above the next non-X team.
    - Everyone else uses power percentile rank (PR) among all 22 teams:
      S >= 85, A >= 70, B >= 55, C >= 40,
      D >= 25, E >= 15, F >= 5, Z < 5.
    PR formula: (N-rank)/(N-1)*100, so #1=100 and last=0.
    Tower/floor ranking can still use the game's normal progress order;
    this block changes team rating only.
  */

  function ctPRRawPowerMap(){
    const out={};
    for(const city of Object.keys(R||{})){
      out[city]=10*teamRaw(city)/Math.max(1e-9,Number(initialTop)||1);
    }
    return out;
  }

  function ctPRTwo(n){return Math.round((Number(n)||0)*100)/100;}

  function ctPRTier(pr){
    if(pr>=85)return 'S';
    if(pr>=70)return 'A';
    if(pr>=55)return 'B';
    if(pr>=40)return 'C';
    if(pr>=25)return 'D';
    if(pr>=15)return 'E';
    if(pr>=5)return 'F';
    return 'Z';
  }

  window.meta = meta = function(){
    const raw=ctPRRawPowerMap();

    // Rating rank is pure current team power, not floor/progress.
    const byPower=Object.keys(raw).sort((a,b)=>{
      const d=(Number(raw[b])||0)-(Number(raw[a])||0);
      return Math.abs(d)>1e-12?d:String(a).localeCompare(String(b),'zh-Hant');
    });

    const n=byPower.length;
    const data=byPower.map((city,i)=>{
      const rank=i+1;
      const pr=n<=1?100:((n-rank)/(n-1))*100;
      return {
        city,
        rawPower:ctPRTwo(raw[city]),
        power:ctPRTwo(raw[city]),
        powerRank:rank,
        pr:Math.round(pr*10)/10,
        tier:ctPRTier(pr)
      };
    });

    // X: unique and optional.
    if(data[0] && data[1] &&
       data[0].power>=50 &&
       data[0].power>=data[1].power*1.25){
      data[0].tier='X';
    }

    // U: unique and optional; test only the strongest non-X team.
    const nonX=data.filter(x=>x.tier!=='X');
    if(nonX[0] && nonX[1] &&
       nonX[0].power>=20 &&
       nonX[0].power>=nonX[1].power*1.12){
      nonX[0].tier='U';
    }

    return Object.fromEntries(data.map(x=>[x.city,x]));
  };

  // Expose thresholds for team-data / future UI descriptions.
  window.CT_TEAM_PR_RATING={
    x:{maxTeams:1,minPower:50,gap:1.25},
    u:{maxTeams:1,minPower:20,gap:1.12},
    prBands:[
      {tier:'S',min:85},{tier:'A',min:70},{tier:'B',min:55},
      {tier:'C',min:40},{tier:'D',min:25},{tier:'E',min:15},
      {tier:'F',min:5},{tier:'Z',min:0}
    ]
  };

  try{
    if(typeof render==='function')render();
  }catch(e){console.warn('CT team PR rating render',e)}
})();
</script>

<script id="ctFinalVisibleBreathEverywhereScript">
(()=>{
  'use strict';
  const TIERS=new Set(['X','U','S','A','B','C','D','E','F','Z']);

  function markOne(el){
    if(!el || el.nodeType!==1)return;
    const raw=(el.textContent||'').trim();
    if(TIERS.has(raw)){
      el.classList.add('tier','tierLetter','tierMotion','ctGlobalTierGlyph',raw);
    }
  }

  function splitHost(el){
    if(!el || el.nodeType!==1 || el.dataset.ctFinalSplit==='1')return;
    const raw=(el.textContent||'').trim();
    const t=raw.slice(0,1);
    if(!TIERS.has(t) || raw.length<2)return;
    const sep=raw.slice(1,2);
    if(!['｜',' ','／','/'].includes(sep))return;

    el.classList.add('ctTierSplitHost');
    el.innerHTML=`<span class="tier tierLetter tierMotion ctGlobalTierGlyph ${t}">${t}</span><span class="ctTierStaticSuffix">${raw.slice(1)}</span>`;
    el.dataset.ctFinalSplit='1';
  }

  function decorate(root=document){
    if(!root)return;

    /* Important fix: MutationObserver-added node itself must be checked, not only descendants. */
    if(root.nodeType===1){
      markOne(root);
      if(root.matches?.('.tGrade.ratingText,.tRosterEquip b.ratingText'))splitHost(root);
    }

    if(!root.querySelectorAll)return;

    root.querySelectorAll(
      '.tierLetter,.tierMotion,.tierMark17428,.tierWord17434,.ctTierFxLetter,.ctGlobalTierGlyph,.ratingText'
    ).forEach(markOne);

    root.querySelectorAll('.tGrade.ratingText,.tRosterEquip b.ratingText').forEach(splitHost);
  }

  decorate(document);
  requestAnimationFrame(()=>decorate(document));

  const mo=new MutationObserver(ms=>{
    for(const m of ms){
      for(const n of m.addedNodes)decorate(n);
    }
  });
  mo.observe(document.body,{subtree:true,childList:true});

  /* Frequent lightweight pass only finds already-existing tier nodes; no DOM rebuild. */
  let last=0;
  function sweep(ts){
    if(ts-last>1200){decorate(document);last=ts;}
    requestAnimationFrame(sweep);
  }
  requestAnimationFrame(sweep);

  window.__CT_FINAL_TIER_FX_DECORATE=decorate;
})();
</script>

<script id="ctUQueenEntranceDecorator">
(()=>{
  const SEL='.tierMotion.U,.ctGlobalTierGlyph.U,.ctTierFxLetter.U';
  function decorate(el){
    if(!el || el.nodeType!==1 || el.dataset.ctUQueenEntrance==='1') return;
    el.dataset.ctUQueenEntrance='1';
    const crown=document.createElement('span'); crown.className='ctUQueenCrown'; crown.setAttribute('aria-hidden','true');
    const gems=document.createElement('span'); gems.className='ctUQueenGems'; gems.setAttribute('aria-hidden','true');
    const stage=document.createElement('span'); stage.className='ctUQueenStage'; stage.setAttribute('aria-hidden','true');
    el.append(stage,crown,gems);
  }
  function scan(root=document){
    if(root.nodeType===1 && root.matches?.(SEL)) decorate(root);
    root.querySelectorAll?.(SEL).forEach(decorate);
  }
  scan(document);
  const mo=new MutationObserver(ms=>{
    for(const m of ms) for(const n of m.addedNodes) if(n.nodeType===1) scan(n);
  });
  mo.observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<!-- CT APP AUTO UPDATE START -->
<script id="ctAppAutoUpdate">
(function(){
  const BUILD = document.querySelector('meta[name="ct-app-build"]')?.content || '';
  const isStandalone =
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;

  if(!isStandalone) return;

  async function checkUpdate(){
    try{
      const base = location.origin + location.pathname;
      const res = await fetch(base + '?ct_update_check=' + Date.now(), {
        cache:'no-store',
        credentials:'same-origin',
        headers:{'Cache-Control':'no-cache'}
      });
      if(!res.ok) return;

      const html = await res.text();
      const m = html.match(/<meta\s+name=["']ct-app-build["']\s+content=["']([^"']+)["']/i);
      const remoteBuild = m && m[1] ? m[1] : '';

      if(!remoteBuild || remoteBuild === BUILD) return;
      if(sessionStorage.getItem('CT_LAST_RELOAD_BUILD') === remoteBuild) return;

      sessionStorage.setItem('CT_LAST_RELOAD_BUILD', remoteBuild);
      location.replace(
        base + '?ctv=' + encodeURIComponent(remoteBuild) + '&t=' + Date.now()
      );
    }catch(e){
      console.warn('CT app update check failed', e);
    }
  }

  setTimeout(checkUpdate, 700);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) setTimeout(checkUpdate, 250);
  });
})();
</script>
<!-- CT APP AUTO UPDATE END -->
