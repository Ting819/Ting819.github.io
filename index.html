function charMetaV173(){

function tCompTier(f,rank,highBoost=0,city=null){

 const boost=Math.max(0,Number(highBoost)||0)+strengthBoost;
 if(boost>0){
  if(rank<=3){A+=boost*.40;B+=boost*.60}
  else if(rank<=10)B+=boost;
 }
 if(A>85)A=85;
 B=Math.min(B,Math.max(0,85-A));
 const low=tInterp([[1,[8,13,20,25,34]],[100,[2,8,16,27,47]],[200,[0,4,12,27,57]],[300,[0,2,8,24,66]],[500,[0,0,4,18,78]],[1000,[0,0,1,9,90]]],f);

}

const BASE_CSTATS_T=window.cstats;
window.cstats=function(c){
 const s=BASE_CSTATS_T(c),items=tForCharAll(c);if(!items.length)return s;
 for(const it of items){
  if(it.tier==='X'){
   const x=XFX[it.type];

   else if(it.type==='shield'){s.hp=Math.round(s.hp*(1+x.hp/100));s.def=Math.round(s.def*(1+x.def/100))}

   else if(it.type==='sigil'){s.crit+=x.crit/100;s.speed*=1+x.speed/100}
   continue;
  }
  const v=TPWR[it.tier];
  if(it.type==='blade'){s.atk=Math.round(s.atk*(1+v));s.crit+=v*.12}
  else if(it.type==='shield'){s.hp=Math.round(s.hp*(1+v*.80));s.def=Math.round(s.def*(1+v*.70))}
  else if(it.type==='wing'){s.speed*=1+v*.45;s.crit+=v*.09}
  else if(it.type==='core'){s.hp=Math.round(s.hp*(1+v*.55));s.atk=Math.round(s.atk*(1+v*.55));s.def=Math.round(s.def*(1+v*.45))}

<script id="ct174107LogicOnlyPatch">
(()=>{
  'use strict';

  // ===== 1) Team same-floor ranking: compare power first, then enemy HP% =====
  window.rank = rank = function(metaSnapshot){
    const m=metaSnapshot||meta();
    return [...states].sort((a,b)=>b.floor-a.floor || m[b.city].power-m[a.city].power || a.enemy.hp/a.enemy.max-b.enemy.hp/b.enemy.max);
  };

  // V17.4.124: battle treasure slots are part of the authoritative card render itself.
  function ctBattleTreasureInline124(c){
    try{
      const api=window.__CT_TREASURE;
      if(!api||typeof api.itemsForChar!=='function'||!c)return '';
      const items=api.itemsForChar(c)||[];
      const names={X:'創世',U:'至尊',S:'神話',A:'傳說',B:'史詩',C:'稀有',D:'精良',E:'優良',F:'普通',Z:'凡品'};
      const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const slots=[0,1,2,3,4].map(i=>{
        const it=items[i];
        if(!it)return '<span class="tBattleSlot empty" title="空裝備槽">◇</span>';
        let img='',effect='';
        try{img=typeof api.svg==='function'?api.svg(it.type,it.tier):''}catch(e){}
        try{effect=typeof api.effect==='function'?api.effect(it.tier,it.type):''}catch(e){}
        const title=esc([it.tier+' '+(names[it.tier]||it.tier),it.name,effect].filter(Boolean).join('｜'));
        return `<span class="tBattleSlot ${it.tier}" title="${title}"><img src="${img}"><i><span class="tierLetter tierMotion ${it.tier}">${it.tier}</span></i></span>`;
      }).join('');
      return `<div class="tBattleTreasureStrip"><span class="tBattleTreasureLabel">裝備</span>${slots}</div>`;
    }catch(e){console.warn('CT124 inline treasure',e);return ''}
  }

  // ===== 2) Persistent render to avoid resetting rating/name animations every repaint =====
  window.render = render = function(){
    let m=meta(), rr=rank(m), lead=rr[0], sel=states.find(x=>x.city===selected)||rr[0];
    $('kt').textContent=turn;
    $('kl').textContent=ctFactionLabel1751(lead.city);
    $('kf').textContent=lead.floor+'F';

    const kr=$('kr'), selTier=m[sel.city].tier;
    let tierFxDirty189=false;
    let krTier=kr && kr.querySelector('.tierMotion');
    if(kr && !krTier){
      krTier=document.createElement('span');
      krTier.className='tier tierLetter tierMotion '+selTier;
      krTier.textContent=selTier;
      krTier.dataset.tier=selTier;
      kr.replaceChildren(krTier);
      tierFxDirty189=true;
    }
    if(krTier && krTier.dataset.tier!==selTier){
      krTier.className='tier tierLetter tierMotion '+selTier;
      krTier.textContent=selTier;
      krTier.dataset.tier=selTier;
      tierFxDirty189=true;
    }

    const kp=$('kp');
    if(kp){
      const pv=m[sel.city].power.toFixed(2);
      if(kp.textContent!==pv)kp.textContent=pv;
      if(kp.dataset.tier!==selTier){kp.className='ratingText '+selTier;kp.dataset.tier=selTier;}
    }

    const tb=$('rank');
    const oldRows=new Map([...tb.querySelectorAll('tr.team')].map(tr=>[tr.dataset.city,tr]));
    const rows=[];
    rr.forEach((s,i)=>{
      const tier=m[s.city].tier;
      let tr=oldRows.get(s.city), isNew=false;
      if(!tr){
        isNew=true;
        tr=document.createElement('tr');
        tr.className='team';
        tr.dataset.city=s.city;
        tr.innerHTML='<td></td><td><div class="city"></div><div class="sub"></div></td><td class="rankTierCell"><span class="rankTierAnchor"><span class="tier tierLetter tierMotion"></span></span></td><td></td><td><b></b><div class="sub"></div></td><td></td><td></td>';
        tr.onclick=()=>{selected=tr.dataset.city;render();};
      }
      tr.classList.toggle('sel',s.city===selected);
      if(tr.children[0].textContent!==String(i+1))tr.children[0].textContent=i+1;
      const teamCell=tr.children[1], tierNode=tr.children[2].querySelector('.tierMotion'), powCell=tr.children[3];
      if(isNew){
        teamCell.querySelector('.city').textContent=ctFactionLabel1751(s.city);
        teamCell.querySelector('.city').style.color=ctFactionColor1751(s.city);
        teamCell.querySelector('.sub').textContent='';
      }
      if(tr.dataset.tier!==tier){
        tr.dataset.tier=tier;
        teamCell.className='teamTint '+tier;
        tierNode.className='tier tierLetter tierMotion '+tier;
        tierNode.textContent=tier;
        tierNode.dataset.tier=tier;
        powCell.className='powerTint '+tier;
        powCell.dataset.tier=tier;
        tierFxDirty189=true;
      }
      const ptxt=m[s.city].power.toFixed(2);
      if(powCell.textContent!==ptxt)powCell.textContent=ptxt;
      const floorCell=tr.children[4],econ210=window.__CT_ECON205_LIVE?.(s.city)||null;
      if(econ210?.mine){
        const tiers210=window.CT_ECONOMY_205?.mining?.tiers||[],mt210=tiers210.find(x=>x.id===econ210.mine.id)||{};
        const rem210=Math.max(0,Math.ceil(Number(econ210.mine.remaining)||0)),tot210=Math.max(1,Number(econ210.mine.total)||Number(mt210.turns)||1),prog210=Math.max(0,Math.min(100,100*(1-rem210/tot210)));
        tr.classList.add('econMiningRow210');
        floorCell.innerHTML=`<b>${s.floor}F ⏸</b><div class="sub">⛏️ 爬塔暫停｜剩 ${rem210}回</div><div class="econ205RankStatus mine">${mt210.name||'⛏️ 挖礦'}｜${prog210.toFixed(1)}%</div>`;
        tr.children[5].innerHTML=`<div class="ctRankMining210"><b>⛏️ ${mt210.name||'礦場'}開採中</b><span>4人爬塔隊伍暫停｜剩 ${rem210}回</span></div>`;
        tr.children[6].innerHTML=`<div class="ctRankMiningEnemy210"><b>🗼 怪物戰鬥暫停</b><span>挖完後自動回到 ${s.floor}F</span></div>`;
      }else{
        tr.classList.remove('econMiningRow210');
        floorCell.innerHTML=`<b>${s.floor}F</b><div class="sub">${s.ft}T｜敵剩${Math.round(s.enemy.hp/s.enemy.max*100)}%</div>${window.__CT_ECON205_FLOOR_HTML?window.__CT_ECON205_FLOOR_HTML(s):''}`;
        tr.children[5].innerHTML='<div class="partyMini">'+s.party.map(p=>{const c=(window.__CT_FAST_CHAR_BY_ID?.(s.city,p.id)||R[s.city].find(x=>x.id===p.id));return `<div class="${window.__CT_RANK_ATTACK_FLASH_ACTIVE?.(p.id)?'miniGaugeFiredCT':''}"><div class="miniName">${ctElementBadge180(c.element,true)} ${p.name} Lv.${c.lv}</div><div class="bar"><i style="width:${100*p.hp/p.max}%"></i></div><div class="sub">${Math.round(p.hp)}/${p.max}｜👟 ${Math.round(p.g)}/100</div><div class="miniGauge17425" aria-label="攻擊條"><i style="width:${Math.max(0,Math.min(100,Number(p.g)||0))}%"></i></div></div>`}).join('')+'</div>';
        {const ep=Math.max(0,Math.min(100,100*s.enemy.hp/Math.max(1,s.enemy.max)));tr.children[6].innerHTML=`<div class="rankEnemy174"><div class="reh174name">${ctElementBadge180(s.enemy.element,true)} ${s.enemy.name}</div><div class="reh174top"><span>${Math.round(s.enemy.hp)} / ${s.enemy.max}</span><span>${Math.round(ep)}%</span></div><div class="reh174track"><div class="reh174fill" style="width:${ep}%"></div></div></div>`;}
      }
      rows.push(tr);
      oldRows.delete(s.city);
    });
    oldRows.forEach(tr=>tr.remove());
    let anchor=tb.firstElementChild;
    for(const tr of rows){
      if(tr!==anchor)tb.insertBefore(tr,anchor);
      anchor=tr.nextElementSibling;
    }
    if(tierFxDirty189){
      try{window.__CT_FINAL_TIER_FX_DECORATE?.(kr||document)}catch(_e){}
      try{window.__CT_FINAL_TIER_FX_DECORATE?.(tb)}catch(_e){}
    }

    let e=sel.enemy;

p.penetration))?p.penetration:ss.penetration)||0)*100).toFixed(1)}%</b></div><div class="stat">連擊<b>${(((Number.isFinite(Number(p.combo))?p.combo:ss.combo)||0)*100).toFixed(1)}%</b></div></div></div>`}).join('')}</div>`;

  };

  // ===== 3) Team tier thresholds kept but widened as latest logic =====
  window.meta = meta = function(){
    let a=Object.keys(R).map(city=>({city,power:window.ctPowerCompress194(teamRaw(city)/initialTop)})).sort((x,y)=>y.power-x.power);
    a.forEach((x,i)=>x.rank=i+1);
    for(const x of a){let v=x.power,r=x.rank;x.tier=v>=9&&r<=3?'S':v>=8&&r<=7?'A':v>=7&&r<=11?'B':v>=6&&r<=15?'C':v>=4.5&&r<=18?'D':v>=4?'E':'F'}
    if(a[0]&&a[1]&&a[0].power>=10&&a[0].power>=a[1].power*1.12)a[0].tier='U';

    if(a[0]&&a[1]&&a[0].power>=50&&a[0].power>=a[1].power*1.25)a[0].tier='X';
    let z=a[a.length-1],p=a[a.length-2];if(z&&p&&z.power<3.3&&z.power<=p.power*.92)z.tier='Z';

  // ===== 4) Character tiers use PR; U up to 3, X unique =====
  window.charMeta = function charMetaV174(){
    // V17.4.112：與角色資料頁顯示的「個人戰力」完全同一把尺。
    let a=Object.values(R).flat().map(c=>({id:c.id,power:window.ctPowerCompress194(craw(c)/initialTop)})).sort((x,y)=>y.power-x.power||String(x.id).localeCompare(String(y.id),'zh-Hant'));
    const n=a.length, EPS=1e-9;
    a.forEach((x,i)=>x.rank=i+1);
    for(let i=0;i<n;){
      let j=i+1;while(j<n && Math.abs(a[j].power-a[i].power)<=EPS)j++;
      const avgRank=((i+1)+j)/2, pr=n>1?100*(n-avgRank)/(n-1):100;
      for(let k=i;k<j;k++)a[k].pr=Math.max(0,Math.min(100,pr));
      i=j;

    for(const x of a){const pr=x.pr;x.tier=pr>=95?'S':pr>=85?'A':pr>=70?'B':pr>=50?'C':pr>=30?'D':pr>=15?'E':pr>=5?'F':'Z';}
    if(a[0] && a[0].power>=50 && (!a[1] || a[0].power>a[1].power))a[0].tier='X';
    let uCount=0;
    for(const x of a){
      if(uCount>=3)break;

    return Object.fromEntries(a.map(x=>[x.id,x]));
  };

  // ===== 5) Warm-up: 1~300F slower monster growth =====
  function warmupMul(f){
    f=Math.max(1,Number(f)||1);

  try{
    for(const s of states||[]){
      if(!s || !s.enemy || s.floor>300)continue;
      const pct=s.enemy.max?Math.max(0,Math.min(1,s.enemy.hp/s.enemy.max)):1, g=s.enemy.g||0;

  // ===== 6) Team rating growth on future level-ups =====
  const TEAM_LV_GROWTH={Z:{atk:15,hp:10},F:{atk:16,hp:11},E:{atk:17,hp:12},D:{atk:18,hp:13},C:{atk:19,hp:14},B:{atk:21,hp:15},A:{atk:24,hp:17},S:{atk:28,hp:20},U:{atk:38,hp:27},X:{atk:55,hp:40}};
  const PREV_CSTATS = window.cstats;
  window.cstats = cstats = function(c){
    const st=PREV_CSTATS(c);
    st.atk=Math.max(1,Math.round(st.atk+(Number(c.ctAtkGrowth)||0)));
    st.hp=Math.max(1,Math.round(st.hp+(Number(c.ctHpGrowth)||0)));
    return st;
  };
  function teamTierNow(city){ try{return meta()[city]?.tier||'Z';}catch(e){return 'Z';} }
  window.gain = gain = function(c,n){
    c.xp=(Number(c.xp)||0)+(Number(n)||0);
    while(c.xp>=xpNeed(c.lv)){
      const tier=teamTierNow(c.city), g=TEAM_LV_GROWTH[tier]||TEAM_LV_GROWTH.Z;
      c.xp-=xpNeed(c.lv); c.lv++;
      c.ctAtkGrowth=(Number(c.ctAtkGrowth)||0)+g.atk;
      c.ctHpGrowth=(Number(c.ctHpGrowth)||0)+g.hp;
    }
  };

  // ===== 7) Genesis catch-up damage and rating EXP bonus =====
  const ROLE_XP={Z:2,F:3,E:4,D:5,C:6,B:8,A:10,S:13,U:18,X:25};
  function genesisInfo(){
    let xCity=null,xFloor=0;
    try{
      const mm=meta();
      for(const city of Object.keys(mm))if(mm[city]?.tier==='X'){xCity=city;break;}
      if(xCity){const xs=states.find(z=>z.city===xCity);xFloor=xs?.floor||0;}
    }catch(e){}
    return {xCity,xFloor};
  }
  function genesisDmgMul(city){
    const g=genesisInfo();
    if(!g.xCity || city===g.xCity)return 1;
    const s=states.find(z=>z.city===city), gap=Math.max(0,g.xFloor-(s?.floor||0));
    if(gap<25)return 1;
    if(gap<50)return 1.03;
    if(gap<100)return 1.06;
    if(gap<200)return 1.10;
    if(gap<400)return 1.15;
    if(gap<700)return 1.20;
    return 1.25;
  }
  const PREV_HIT = window.hit;
  window.hit = hit = function(s,p){
    let c=R[s.city].find(x=>x.id===p.id);
    if(!c)return PREV_HIT(s,p);
    const cm=window.charMeta?.()||{}, tier=(cm[c.id]?.tier)||'Z', critBefore=Number(c.crits)||0, before=Math.max(0,Number(s.enemy?.hp)||0);
    let killed=PREV_HIT(s,p);
    const crit=(Number(c.crits)||0)>critBefore;
    let bonus=ROLE_XP[tier]||2;
    if(crit)bonus=Math.round(bonus*1.5);
    gain(c,bonus);
    c.ctRatingXp=(Number(c.ctRatingXp)||0)+bonus;
    if(!killed && s.enemy && s.enemy.hp>0){

        const extra=Math.max(1,Math.round(dealt*(mul-1)));
        s.enemy.hp=Math.max(0,s.enemy.hp-extra);
        if(s.enemy.hp<=0){
          c.kills=(Number(c.kills)||0)+1;
          let k=XP_K[s.enemy.key]||12; gain(c,k); killed=true;
          log(s,`🌌 創世威壓追趕 ×${mul.toFixed(2)}｜追加 -${extra}｜擊殺 EXP +${k}`);
        }
      }
    }
    if(killed){
      s.ctKoAttacker174133=p.id;
      s.ctKoFlashPainted174133=false;
    }
    return killed;
  };

  try{ render(); save(true); }catch(e){ console.warn('CT174107 init',e); }
})();

<script id="ct174127StatsRecalc">
(()=>{
'use strict';
const CAP_DODGE=.50, CAP_CRIT=.80, CAP_CRITDMG=5.00;
const TREASURE_PWR={Z:.015,F:.025,E:.040,D:.060,C:.090,B:.130,A:.180,S:.450,U:1.000,X:2.200};
const DODGE_BY_TIER={Z:.005,F:.010,E:.015,D:.020,C:.030,B:.040,A:.060,S:.090,U:.140,X:.200};
const CRITDMG_BY_TIER={Z:.02,F:.03,E:.05,D:.07,C:.10,B:.15,A:.22,S:.35,U:.55,X:.90};
const XFX127={blade:{atk:220,crit:25},shield:{hp:175,def:155},wing:{speed:100,crit:20},core:{hp:120,atk:120,def:100},sigil:{crit:30,speed:55}};

function items127(c){

}
function rawBase127(c,baseOnly=false){

    hp:Math.max(1,Math.round((Number(c.hp)||1)*10*(1+n*.0130)*g)),

    def:Math.max(0,Math.round((Number(c.def)||0)*(1+n*.0108)*g)),
    speed:Math.max(4,8+((Number(c.mob)||50)-50)/150*16+n*.055),
    crit:Math.max(.02,.05+((Number(c.tech)||50)-50)/150*.18+n*.00055),
    dodge:Math.max(.02,.03+((Number(c.mob)||50)-50)/150*.24+n*.00040),

}
function applyTreasure127(s,c){

    if(it.tier==='X'){
      const x=XFX127[it.type]||{},sm=typeof tStarEffectMul==='function'?tStarEffectMul(it):1;
      if(it.type==='blade'){s.atk*=1+(x.atk||0)*sm/100;s.crit+=(x.crit||0)*sm/100}
      else if(it.type==='shield'){s.hp*=1+(x.hp||0)*sm/100;s.def*=1+(x.def||0)*sm/100}
      else if(it.type==='wing'){s.speed*=1+(x.speed||0)*sm/100;s.crit+=(x.crit||0)*sm/100;s.dodge+=(DODGE_BY_TIER.X||0)*sm}
      else if(it.type==='core'){s.hp*=1+(x.hp||0)*sm/100;s.atk*=1+(x.atk||0)*sm/100;s.def*=1+(x.def||0)*sm/100}
      else if(it.type==='sigil'){s.crit+=(x.crit||0)*sm/100;s.speed*=1+(x.speed||0)*sm/100;s.critDmg+=(CRITDMG_BY_TIER.X||0)*sm}
      continue;
    }
    const v=TREASURE_PWR[it.tier]||0;
    if(it.type==='blade'){s.atk*=1+v;s.crit+=v*.12}
    else if(it.type==='shield'){s.hp*=1+v*.80;s.def*=1+v*.70}
    else if(it.type==='wing'){s.speed*=1+v*.45;s.crit+=v*.09;s.dodge+=(DODGE_BY_TIER[it.tier]||0)}
    else if(it.type==='core'){s.hp*=1+v*.55;s.atk*=1+v*.55;s.def*=1+v*.45}
    else if(it.type==='sigil'){s.crit+=v*.14;s.speed*=1+v*.25;s.critDmg+=(CRITDMG_BY_TIER[it.tier]||0)}

  return s;
}
function finalize127(s,c,baseOnly=false){

<script>
(()=>{
  'use strict';

  function ctRawTeamPowerMap(){
    const out={};
    for(const city of Object.keys(R||{})){
      out[city]=window.ctPowerCompress194(teamRaw(city)/Math.max(1e-9,Number(initialTop)||1));
    }
    return out;
  }

  function ctProgressRank(raw){
    return [...(states||[])].sort((a,b)=>{
      const af=Number(a?.floor)||0, bf=Number(b?.floor)||0;
      if(bf!==af)return bf-af;
      const ar=(Number(a?.enemy?.hp)||0)/Math.max(1,Number(a?.enemy?.max)||1);
      const br=(Number(b?.enemy?.hp)||0)/Math.max(1,Number(b?.enemy?.max)||1);
      if(Math.abs(ar-br)>1e-12)return ar-br;
      const ap=Number(raw[a?.city])||0, bp=Number(raw[b?.city])||0;
      if(Math.abs(bp-ap)>1e-12)return bp-ap;
      return String(a?.city||'').localeCompare(String(b?.city||''),'zh-Hant');
    });
  }

  function ctTwo(x){ return Math.round((Number(x)||0)*100)/100; }

  // 排名仍以樓層/當層進度為主；戰力指數則保證由上往下嚴格不增加。
  window.meta = meta = function(){
    const raw=ctRawTeamPowerMap();
    const rr=ctProgressRank(raw);
    const a=[];
    let prev=Infinity;

    rr.forEach((s,i)=>{
      const rawPower=ctTwo(raw[s.city]);
      let power;
      if(i===0){
        power=rawPower;
      }else{
        const ceiling=ctTwo(prev-0.01);
        power=Math.min(rawPower,ceiling);
      }
      power=Math.max(0,power);
      prev=power;
      a.push({city:s.city,power,rawPower,rank:i+1,tier:'F'});
    });

    // 基礎評級先依「排名後的戰力指數」判定。
    for(const x of a){
      const v=x.power,r=x.rank;
      x.tier=v>=9&&r<=3?'S':v>=8&&r<=7?'A':v>=7&&r<=11?'B':v>=6&&r<=15?'C':v>=4.5&&r<=18?'D':v>=4?'E':'F';
    }

    // 先決定唯一 X。
    if(a[0] && a[1] && a[0].power>=50 && a[0].power>=a[1].power*1.25){
      a[0].tier='X';
    }

    // 再從「非 X」隊伍往下找一個 U；因此 X 不會再把 U 名額吃掉。
    const nonX=a.filter(x=>x.tier!=='X');
    for(let i=0;i<nonX.length-1;i++){
      const cur=nonX[i], next=nonX[i+1];
      if(cur.rank>3)break;
      if(cur.power>=10 && cur.power>=next.power*1.12){
        cur.tier='U';
        break;
      }
    }

    const z=a[a.length-1], p=a[a.length-2];
    if(z&&p&&z.power<3.3&&z.power<=p.power*.92)z.tier='Z';
    return Object.fromEntries(a.map(x=>[x.city,x]));
  };

  // 排名規則保持原本的爬塔進度邏輯，不用 meta() 反過來排序，避免循環與跳動。
  window.rank = rank = function(){
    return ctProgressRank(ctRawTeamPowerMap());
  };
})();
</script>

<script id="ctTierFxPreviewScript">
(()=>{
  'use strict';
  const tiers=['X','U','S','A','B','C','D','E','F','Z'];
  const desc={X:'創世白金呼吸＋單神環＋星河＋四重爆發',U:'至尊呼吸＋粉紫側弧＋單神環＋爆發舞台',S:'深紅小戰徽＋大範圍呼吸光＋重擊爆發',A:'橘金側飾＋大範圍柔光呼吸（無實體環無脈衝）',B:'紫色弱呼吸',C:'純藍弱呼吸',D:'柔綠微呼吸',E:'白色普通評級',F:'咖啡色瑕疵評級',Z:'灰色大裂痕評級'};
  const back=document.getElementById('ctTierFxBack');
  const grid=document.getElementById('ctTierFxGrid');
  let focusedTier=null;
  function build(){
    if(!grid)return;
    grid.innerHTML=tiers.map(t=>`<div class="ctTierFxCard ${t}${focusedTier===t?' ctTierFxFocused':''}" data-tier="${t}"><span class="ctTierFxLetter ${t}">${t}</span><div class="ctTierFxName">${desc[t]}</div></div>`).join('');
    if(focusedTier){
      requestAnimationFrame(()=>grid.querySelector(`.ctTierFxCard[data-tier="${focusedTier}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}));
    }
  }
  function open(tier=null){focusedTier=tiers.includes(tier)?tier:null;build();back?.classList.add('open');back?.setAttribute('aria-hidden','false');}
  function close(){back?.classList.remove('open');back?.setAttribute('aria-hidden','true');focusedTier=null;}
  document.getElementById('tierFxPreview')?.addEventListener('click',()=>open(null));
  document.getElementById('ctTierFxReplay')?.addEventListener('click',()=>{grid.innerHTML='';requestAnimationFrame(build);});
  document.getElementById('ctTierFxClose')?.addEventListener('click',close);
  back?.addEventListener('click',e=>{if(e.target===back)close();});
  window.openTierFxPreview=open;
})();
</script>

<script id="ctTeamPRRatingSystem">
(()=>{
  'use strict';

  /*
    Team rating:
    - X: max 1 team, only current #1 by team power, absolute power >= 50,
         and >= 25% above #2.
    - U: top non-X cluster in the main top 3, absolute power >= 10.
         Adjacent teams with <12% power difference are the same cluster;
         when the cluster is >=12% above the next team, the whole cluster is U (max 2 teams).
    - Everyone else uses power percentile rank (PR) among all 22 teams:
      S >= 85, A >= 70, B >= 55, C >= 40,
      D >= 25, E >= 15, F >= 5, Z < 5.
    PR formula: (N-rank)/(N-1)*100, so #1=100 and last=0.
    Tower/floor ranking can still use the game's normal progress order;
    this block changes team rating only.
  */

  function ctPRRawPowerMap(){
    const out={};
    for(const city of Object.keys(R||{})){
      out[city]=window.ctPowerCompress194(teamRaw(city)/Math.max(1e-9,Number(initialTop)||1));
    }
    return out;
  }

  function ctPRTwo(n){return Math.round((Number(n)||0)*100)/100;}

  function ctPRTier(pr){
    if(pr>=85)return 'S';
    if(pr>=70)return 'A';
    if(pr>=55)return 'B';
    if(pr>=40)return 'C';
    if(pr>=25)return 'D';
    if(pr>=15)return 'E';
    if(pr>=5)return 'F';
    return 'Z';
  }

  window.meta = meta = function(){
    const raw=ctPRRawPowerMap();

    // 先用純隊伍戰力計算原始 PR／原始評級；powerRank 只代表戰力名次。
    const byPower=Object.keys(raw).sort((a,b)=>{
      const d=(Number(raw[b])||0)-(Number(raw[a])||0);
      return Math.abs(d)>1e-12?d:String(a).localeCompare(String(b),'zh-Hant');
    });

    const n=byPower.length;
    const data=byPower.map((city,i)=>{
      const powerRank=i+1;
      const pr=n<=1?100:((n-powerRank)/(n-1))*100;
      return {
        city,
        rawPower:ctPRTwo(raw[city]),
        power:ctPRTwo(raw[city]),
        rank:powerRank,
        powerRank,
        pr:Math.round(pr*10)/10,
        tier:ctPRTier(pr)
      };
    });

    // 先依純隊伍戰力資格產生唯一 X；U 改到主排行榜名次鎖定後，
    // 依「前段同梯隊＋下方 12% 斷層」判定。
    if(data[0] && data[1] &&
       data[0].power>=50 &&
       data[0].power>=data[1].power*1.25){
      data[0].tier='X';
    }

    const byCity=Object.fromEntries(data.map(x=>[x.city,x]));

    // 主排行榜正式名次：樓層高者優先；同樓層先看怪物剩餘 HP%，再看戰力。
    const progress=[...(states||[])].sort((a,b)=>{
      const af=Number(a?.floor)||0, bf=Number(b?.floor)||0;
      if(bf!==af)return bf-af;
      const ar=(Number(a?.enemy?.hp)||0)/Math.max(1,Number(a?.enemy?.max)||1);
      const br=(Number(b?.enemy?.hp)||0)/Math.max(1,Number(b?.enemy?.max)||1);
      if(Math.abs(ar-br)>1e-12)return ar-br;
      const ap=Number(raw[a?.city])||0, bp=Number(raw[b?.city])||0;
      if(Math.abs(bp-ap)>1e-12)return bp-ap;
      return String(a?.city||'').localeCompare(String(b?.city||''),'zh-Hant');
    });

    // rank 改為畫面真正顯示的主排行榜名次；powerRank 保留純戰力名次。
    progress.forEach((s,i)=>{if(byCity[s.city])byCity[s.city].rank=i+1;});

    // 以高排名為準：低排名可同級或更低，但永遠不能高於任何上方隊伍。
    // 只向下修正，絕不把高排名隊伍為了配合後面而往上抬級。
    const tierOrder=['X','U','S','A','B','C','D','E','F','Z'];
    for(let i=1;i<progress.length;i++){
      const prev=byCity[progress[i-1].city], cur=byCity[progress[i].city];
      if(!prev||!cur)continue;
      const p=tierOrder.indexOf(prev.tier), c=tierOrder.indexOf(cur.tier);
      if(p>=0 && c>=0 && c<p)cur.tier=prev.tier;
    }

    // V17.4.204：U 改為「同梯隊斷層」判定。
    // 規則：
    // 1) 只看主排行榜前 3 名中的最強非 X 集團。
    // 2) 戰力皆需 >= 10.00。
    // 3) 相鄰兩隊戰力比 < 1.12（差 <12%）視為同一梯隊。
    // 4) 最多把前兩支非 X 隊綁成同一 U 梯隊。
    // 5) 該梯隊最末隊必須對下一名形成 >=12% 斷層，整梯才升 U。
    //    因此 100.22 / 94.98 < 1.12 且 94.98 / 83.83 >= 1.12 => 前兩隊同為 U。
    const progressRows=progress.map(s=>byCity[s.city]).filter(Boolean);
    const uStart=progressRows.findIndex(x=>x.tier!=='X' && x.rank<=3);
    if(uStart>=0){
      const first=progressRows[uStart];
      if(first && first.rank<=3 && first.power>=10){
        const group=[first];
        const second=progressRows[uStart+1];
        if(second && second.tier!=='X' && second.rank<=3 && second.power>=10){
          const hi=Math.max(first.power,second.power), lo=Math.max(1e-9,Math.min(first.power,second.power));
          if(hi/lo < 1.12)group.push(second);
        }
        const bottom=group[group.length-1];
        const next=progressRows[uStart+group.length];
        const separated=!next || (bottom.power>=next.power*1.12);
        if(separated){
          for(const x of group)x.tier='U';
        }
      }
    }

    return byCity;
  };

  // Expose thresholds for team-data / future UI descriptions.
  window.CT_TEAM_PR_RATING={
    x:{maxTeams:1,minPower:50,gap:1.25},
    u:{maxTeams:2,minPower:10,gap:1.12,sameClusterBelow:1.12,maxRank:3,mode:'top-cluster'},
    rankLock:'main-progress-rank-high-first',
    updateSafe:true,
    build:CT_BUILD_VERSION,
    prBands:[
      {tier:'S',min:85},{tier:'A',min:70},{tier:'B',min:55},
      {tier:'C',min:40},{tier:'D',min:25},{tier:'E',min:15},
      {tier:'F',min:5},{tier:'Z',min:0}
    ]
  };

  try{
    if(typeof render==='function')render();
  }catch(e){console.warn('CT team PR rating render',e)}
})();
</script>

<script id="ctAppAutoUpdate">
(function(){
  const BUILD = document.querySelector('meta[name="ct-app-build"]')?.content || '';
  const isStandalone =
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;

  if(!isStandalone) return;

  async function checkUpdate(){
    try{
      const base = location.origin + location.pathname;
      const res = await fetch(base + '?ct_update_check=' + Date.now(), {
        cache:'no-store',
        credentials:'same-origin',
        headers:{'Cache-Control':'no-cache'}
      });
      if(!res.ok) return;

      const html = await res.text();
      const m = html.match(/<meta\s+name=["']ct-app-build["']\s+content=["']([^"']+)["']/i);
      const remoteBuild = m && m[1] ? m[1] : '';

      if(!remoteBuild || remoteBuild === BUILD) return;
      if(sessionStorage.getItem('CT_LAST_RELOAD_BUILD') === remoteBuild) return;

      sessionStorage.setItem('CT_LAST_RELOAD_BUILD', remoteBuild);
      location.replace(
        base + '?ctv=' + encodeURIComponent(remoteBuild) + '&t=' + Date.now()
      );
    }catch(e){
      console.warn('CT app update check failed', e);
    }
  }

  setTimeout(checkUpdate, 700);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) setTimeout(checkUpdate, 250);
  });
})();
</script>

<script id="ctTierDomAndStaticPeakOptimized">(()=>{

const SPLIT_SEL='.tGrade.ratingText,.tRosterEquip b.ratingText';
const U_SEL='.tierMotion.U,.ctGlobalTierGlyph.U,.ctTierFxLetter.U';
const X_SEL='.tierMotion.X,.ctGlobalTierGlyph.X,.ctTierFxLetter.X';
const PEAK_SEL='.ratingText,.tierLetter,.tier,.tGrade,.tierWord17434,.catalogTierTitle,.tName,.teamTint .city,.teamTint .sub,.powerTint,b,.sub,span,div';

function markOne(el){
  if(!el||el.nodeType!==1)return;
  const raw=(el.textContent||'').trim();
  if(!TIERS.has(raw))return;
  el.classList.add('tier','tierLetter','tierMotion','ctGlobalTierGlyph',raw);
  el.dataset.ctTierSplit='1';
}
function splitHost(el){
  if(!el||el.nodeType!==1||el.dataset.ctTierSplit==='1'||el.dataset.ctFinalSplit==='1')return;
  const raw=(el.textContent||'').trim(),t=raw.slice(0,1),sep=raw.slice(1,2);
  if(!TIERS.has(t)||raw.length<2||!['｜',' ','／','/'].includes(sep))return;
  el.classList.add('ctTierSplitHost');
  el.innerHTML=`<span class="tier tierLetter tierMotion ctGlobalTierGlyph ${t}">${t}</span><span class="ctTierStaticSuffix">${raw.slice(1)}</span>`;
  el.dataset.ctTierSplit='1';el.dataset.ctFinalSplit='1';
}
function decorateU(el){

    root.querySelectorAll?.(U_SEL).forEach(decorateU);

 async function smartSync(userAction=false){

 function installUI(){

  document.addEventListener('click',e=>{if(e.target?.id==='auto'&&window.__CT_CLOUD_LOCKED_175){e.preventDefault();e.stopImmediatePropagation();openModal();setStatus('⚠️ 這台目前不是主裝置。先按「下載雲端並接管」再繼續爬塔。','warn')}},true);
  document.addEventListener('click',e=>{if(e.target?.id==='reset1747Yes'){safeSet(FORCE_LOCAL_KEY,'1');setTimeout(()=>{if(session)uploadCloud(true,true).catch(()=>{})},1000)}},true);
  q('save')?.addEventListener('click',()=>setTimeout(()=>{if(cloudStarted&&session&&!locked)uploadCloud(false,true).catch(()=>{})},300));
  document.addEventListener('visibilitychange',()=>{if(document.hidden){return}else if(cloudStarted&&session)smartSync(false).catch(()=>{})},false);
  const oldStart=window.start;if(typeof oldStart==='function')window.start=function(){if(window.__CT_CLOUD_LOCKED_175){openModal();setStatus('⚠️ 另一裝置正在使用雲端存檔，這台已鎖定。','warn');return}return oldStart.apply(this,arguments)};

 async function activateCloud(){
  if(cloudStarted||cloudStarting)return;

<script id="ct182PenetrationComboFinal">
(()=>{
'use strict';
const clamp182=(x,a,b)=>Math.max(a,Math.min(b,x));
window.ctEffectiveDef182=function(def,pen){return Math.max(0,(Number(def)||0)*(1-clamp182(Number(pen)||0,0,.95)))};
window.ctSecondHit182=function(st,firstCrit){const combo=Math.random()<(Number(st?.combo)||0);if(!combo)return{combo:false,crit:false};return{combo:true,crit:!!firstCrit||Math.random()<(Number(st?.crit)||0)}};

// Natural stats: penetration is technology-oriented; combo is mobility-oriented. Both remain derived stats, so saves stay compatible.
const prevCstats182=window.cstats;
window.cstats=cstats=function(c){
  const s=prevCstats182(c),n=Math.max(0,(Number(c?.lv)||1)-1),tech=Number(c?.tech)||50,mob=Number(c?.mob)||50;
  s.penetration=clamp182(.03+((tech-50)/150)*.15+n*.00035,.03,.35);
  s.combo=clamp182(.03+((mob-50)/150)*.12+n*.00025,.03,.30);
  return s;
};
window.CT_STAT_CAPS={...(window.CT_STAT_CAPS||{}),penetration:.35,combo:.30};

// Make the new offensive stats count in character/team power without changing save data.
const prevCraw182=window.craw;
window.craw=craw=function(c){const v=prevCraw182(c),s=window.cstats(c);return v*Math.sqrt((1+(s.combo||0))*(1+(s.penetration||0)*.45))};

// Refresh current tower fighters with the newly derived stats.
try{for(const st of states||[])for(const p of st.party||[]){const c=R[st.city]?.find(x=>x.id===p.id);if(!c)continue;const s=ctApplyBattleRoll(window.cstats(c),p.battleRoll||(p.battleRoll=ctNewBattleRoll()));p.penetration=s.penetration;p.combo=s.combo}}catch(e){console.warn('CT182 party stats refresh',e)}

// Tower combat: penetration reduces enemy DEF; combo performs a real second hit. If hit #1 crits, hit #2 is forced to crit.
const prevHit182=window.hit;
window.hit=hit=function(s,p){
  const c=R[s.city]?.find(x=>x.id===p.id);if(!c)return prevHit182(s,p);
  const st=ctApplyBattleRoll(window.cstats(c),p.battleRoll||(p.battleRoll=ctNewBattleRoll())),origDef=Number(s.enemy?.def)||0,beforeCrit=Number(c.crits)||0;
  let killed=false;
  try{s.enemy.def=window.ctEffectiveDef182(origDef,st.penetration);killed=prevHit182(s,p)}finally{s.enemy.def=origDef}
  if(killed||!s.enemy||s.enemy.hp<=0||Math.random()>=(st.combo||0))return killed;
  const firstCrit=(Number(c.crits)||0)>beforeCrit,oldCrit=p.crit;
  try{
    if(firstCrit)p.crit=1;
    s.enemy.def=window.ctEffectiveDef182(origDef,st.penetration);
    log(s,`🔁 ${p.name} 觸發連擊${firstCrit?'｜首擊暴擊→第二擊必暴擊':''}`);
    killed=prevHit182(s,p)||killed;
  }finally{p.crit=oldCrit;s.enemy.def=origDef}
  return killed;
};

// UI is rendered canonically in V17.4.184 CLEAN; no post-render DOM patch is needed.

try{render()}catch(e){console.warn('CT182 initial render',e)}
})();
</script>

const rawCstats190=window.cstats;
const statCache190=new WeakMap();
function statSig190(c){
  if(!c)return '';

<script id="ct174192ElementPowerNormalization">
(()=>{
'use strict';
/* V17.4.204 — canonical attribute power coefficients + 0.5 power compression.
   These coefficients affect displayed character/team power only; combat element multipliers remain unchanged.
   New-game baseline is recalculated AFTER fixed character elements are assigned; visible/rating power then uses 10*sqrt(raw/baseline), so the strongest opening TEAM is exactly 10.00. */
const ELEMENT_POWER_192=Object.freeze({water:1.00,fire:1.00,wood:1.00,light:1.20,dark:1.19,thunder:1.70});
window.CT_ELEMENT_POWER_192=ELEMENT_POWER_192;
window.ctElementPower192=function(element){return Number(ELEMENT_POWER_192[element])||1};

const rawCraw192=window.craw;
if(typeof rawCraw192==='function'){
  window.craw=craw=function(c){
    const base=Number(rawCraw192(c))||0;
    return base*window.ctElementPower192(c?.element);
  };
}

function baseClone192(c){
  return {...c,lv:1,xp:0,bonus:0,ctAtkGrowth:0,ctHpGrowth:0,ctRatingXp:0,treasureIds:[],treasureId:null,ctGenesisRoll:ctNeutralGenesis1753()};
}
function openingBaseline192(){
  let top=1;
  for(const city of Object.keys(R||{})){
    const a=R[city]||[];if(!a.length)continue;
    const avg=a.reduce((sum,c)=>sum+craw(baseClone192(c)),0)/a.length;
    if(Number.isFinite(avg)&&avg>top)top=avg;

// Replace new-game init so element assignment happens first, then the opening baseline is normalized.

  window.__CT_REBASELINE_192();
  turn=0;nextEvent=160+Math.floor(Math.random()*100);lastEvent=null;
  states=Object.keys(R).map(city=>({city,floor:1,party:null,enemy:null,ft:0,log:[]}));
  for(const st of states)nb(st);

// Public rule metadata for help/review UI.

try{if(window.CT_TEAM_PR_RATING?.u)window.CT_TEAM_PR_RATING.u.minPower=10}catch(_e){}

</script>


<script id="ct174193FairKoTowerFx">
(()=>{
'use strict';
/* V17.4.204
   1) Every team gets the same one-turn KO hold before entering the next floor.
   2) The watched tower battle keeps the KO attack gold flash.
   3) Tower enemy attacks have their own attack FX.
   4) A successful tower dodge shows only MISS on the exact dodging character card.
   Combat formulas, rewards, elements and activity combat logic are unchanged. */

// ----- Fair KO cadence: one complete simulation turn for ALL 22 teams -----
const prevRound193=window.round;
if(typeof prevRound193==='function'){
  window.round=round=function(s){
    if(!s)return prevRound193(s);
    if(s.ctClearPending174133){
      const now=Number(window.turn??turn)||0;
      if(!Number.isFinite(Number(s.ctKoHoldTurn193))){
        // First pending turn after the killing blow is always a pure KO hold turn.
        s.ctKoHoldTurn193=now;
        return;
      }
      if(now<=Number(s.ctKoHoldTurn193))return;
      // Visual painting must never make the selected team wait longer than everyone else.
      s.ctKoFlashPainted174133=true;
      delete s.ctKoHoldTurn193;
    }
    const out=prevRound193(s);
    if(!s.ctClearPending174133)delete s.ctKoHoldTurn193;
    return out;
  };
}

function towerCard193(s,id){
  if(!s||s.city!==selected)return null;
  const i=(s.party||[]).findIndex(p=>p.id===id);
  if(i<0)return null;
  return document.querySelectorAll('#arena .cards .card')[i]||null;
}
function flashKoGold193(s,id){
  const card=towerCard193(s,id);if(!card)return;
  card.classList.add('gaugeFired17424');
  const seq=String((Number(card.dataset.gaugeSeq17424)||0)+1);
  card.dataset.gaugeSeq17424=seq;
  setTimeout(()=>{if(card.dataset.gaugeSeq17424===seq)card.classList.remove('gaugeFired17424')},220);
}

// Guarantee that the killing attack is visibly gold even at 25x/100x.
const prevHit193=window.hit;
if(typeof prevHit193==='function'){
  window.hit=hit=function(s,p){
    const c=(s&&p?.id)?R[s.city]?.find(x=>x.id===p.id):null;
    const attacksBefore=Number(c?.attacks)||0;
    const killed=prevHit193(s,p);
    const attacksAfter=Number(c?.attacks)||0;
    // Every team's real tower attack marks a cheap visual expiry state. The rank
    // painter consumes it later, so 25x/100x keeps V190 performance and never
    // depends on the city being selected.
    if(c&&attacksAfter>attacksBefore)window.__CT_MARK_RANK_ATTACK_FLASH?.(c.id,killed?1200:undefined);
    if(killed&&s?.city===selected&&p?.id)flashKoGold193(s,p.id);
    return killed;
  };
}

// The final treasure-aware ehit did not publish tower FX events. Wrap it without
// touching its target selection, dodge roll, shield, revive or damage formulas.
const prevEhit193=window.ehit;
if(typeof prevEhit193==='function'){
  window.ehit=ehit=function(s){
    if(!s)return prevEhit193(s);
    const beforeLog=s.log?.[0]||'';
    const out=prevEhit193(s);
    if(s.city!==selected)return out;

    // Enemy visibly attacks on every tower attack attempt, including a MISS.
    try{ctCombatEnemyFx(document.querySelector('#arena .enemy'))}catch(_e){}

    // The dodge log is generated only when that exact target evades. Show MISS
    // on that character card only; no extra DODGE/閃避 label is added.
    const newest=s.log?.[0]||'';
    if(newest!==beforeLog){
      const m=newest.match(/｜💨\s*(.+?)\s*閃避怪物攻擊/);
      if(m){
        const name=m[1],p=(s.party||[]).find(x=>x.name===name);
        const card=p?towerCard193(s,p.id):null;
        if(card)try{ctCombatDodgeFx(card)}catch(_e){}
      }
    }
    return out;
  };
}

// Recover old saves that happened to be stored on a pre-193 KO frame.
try{for(const s of states||[])if(s)delete s.ctKoHoldTurn193}catch(_e){}
})();
</script>

<script id="ct1753GenesisFinalBridge">
(()=>{
'use strict';
/* V17.5.3 final bridge: apply the per-new-game roll AFTER every legacy cstats/craw patch,
   so visible character stats, combat snapshots and leaderboard power all agree. */
const prevStats=window.cstats,prevRaw=window.craw;
if(typeof prevStats!=='function'||typeof prevRaw!=='function')return;
const metric=s=>{
 const d=Math.max(0,Math.min(.70,Number(s?.dodge)||0));
 const ehp=(Number(s?.hp)||1)*(1+(Number(s?.def)||0)*.006)/Math.max(.01,1-d);
 const dps=(Number(s?.atk)||1)*(Math.max(4,Number(s?.speed)||4)/100)*(1+(Number(s?.crit)||0)*(Number(s?.critDmg)||.50));
 const p=Math.max(0,Number(s?.penetration)||0),co=Math.max(0,Number(s?.combo)||0);
 return Math.sqrt(Math.max(1,ehp*dps))*Math.sqrt((1+co)*(1+p*.45));
};
window.cstats=cstats=function(c){
 const b={...prevStats(c)},g=ctApplyGenesis1753(b,c);
 // Preserve late-added fields not touched by ctApplyGenesis1753.
 for(const k of ['penetration','combo'])if(Number.isFinite(Number(b[k])))g[k]=Number(b[k]);
 return g;
};
window.craw=craw=function(c){
 const b=prevStats(c),g=window.cstats(c),den=metric(b),num=metric(g),raw=Number(prevRaw(c))||0;
 return raw*(den>0?num/den:1);
};
window.teamRaw=teamRaw=function(city){const a=R[city]||[];return a.length?a.reduce((q,c)=>q+craw(c),0)/a.length:0};
// The baseline intentionally ignores ctGenesisRoll (baseClone192 sets it to neutral), so new-game power stays visible.
try{
 for(const st of states||[]){
  for(const p of st.party||[]){
   const c=(R[st.city]||[]).find(x=>x.id===p.id);if(!c)continue;
   const oldMax=Math.max(1,Number(p.max)||1),ratio=Math.max(0,Math.min(1,(Number(p.hp)||0)/oldMax));
   const z=ctBattleStats(c,p.battleRoll||(p.battleRoll=ctNewBattleRoll())),ns=z.s;
   p.max=ns.hp;p.hp=p.alive===false?0:Math.max(1,Math.round(ns.hp*ratio));p.atk=ns.atk;p.def=ns.def;p.speed=ns.speed;p.crit=ns.crit;p.dodge=ns.dodge;p.critDmg=ns.critDmg;p.penetration=ns.penetration;p.combo=ns.combo;
  }
 }
 if(typeof render==='function')render();if(typeof save==='function')save(true);
}catch(e){console.warn('CT1753 final genesis refresh',e)}
})();
</script>

function renderHeroCards(city){const cmaps=R?.[city]||[];return cmaps.map(c=>{const m=cm(c),r=roleInfo(c),set=setInfo(c),aff=equipped(c).flatMap(itemAffixes).slice(0,6),cost=m.stars>=6?0:20*m.stars*m.stars;return `<div class="ct19Card"><div class="ct19HeroRow"><div class="ct19HeroIcon">${r.icon}</div><div><div class="ct19HeroName">${c.name} <span class="ct19Badge ${r.key}">${r.icon}${r.name}</span></div><div class="ct19Stars">${'★'.repeat(m.stars)}${'☆'.repeat(6-m.stars)}</div><div class="sub">Lv.${c.lv}｜${ctElementBadge180?.(c.element,true)||''}｜評級 ${charTier(c)}</div></div></div><div class="ct19SkillBox"><b>ULT｜${SKILLS[r.key].name} Lv.${m.skillLv}</b><div class="sub">${SKILLS[r.key].desc}</div><div class="sub">被動 Lv.${m.passiveLv}｜${r.key==='tank'?'降低承傷並獲得開場護盾':r.key==='warrior'?'敵人半血以下增傷':r.key==='archer'?'每第5次攻擊必定暴擊':r.key==='mage'?'元素技能附加 Debuff':'週期性治療最低血量隊友'}</div></div><div class="ct19Set">${set.label}</div><div>${aff.map(a=>`<span class="ct19Affix">${a.name} +${(a.v*100).toFixed(1)}%</span>`).join('')||'<span class="sub">目前裝備沒有副詞條</span>'}</div><button data-star="${c.id}" ${m.stars>=6||M.starDust<cost?'disabled':''}>${m.stars>=6?'六星已滿':'⭐ 升星｜'+cost+' 星塵'}</button> <button data-skill="${c.id}" ${M.skillPts<m.skillLv||m.skillLv>=10?'disabled':''}>大招 Lv.${m.skillLv+1}｜${m.skillLv}點</button> <button data-passive="${c.id}" ${M.skillPts<m.passiveLv||m.passiveLv>=10?'disabled':''}>被動 Lv.${m.passiveLv+1}｜${m.passiveLv}點</button></div>`}).join('')}
function adventureTabs(){return [['heroes','👥 角色'],['team','⚔️ 隊伍'],['map','🗺️ 地圖'],['quests','📋 任務'],['ach','🏅 成就'],['season','🎟️ 賽季'],['settings','⚙️ 設定']].map(([k,n])=>`<button data-tab="${k}" class="${advTab===k?'on':''}">${n}</button>`).join('')}

    const lv=Math.floor(M.season.xp/500)+1,pct=(M.season.xp%500)/5;
    return `<div class="ct19Grid two"><div class="ct19Card"><h3>🎟️ S${M.season.id}｜世界遠征賽季</h3><div class="big">Lv.${lv}</div><div class="ct19Progress"><i style="width:${pct}%"></i></div><div class="sub">EXP ${M.season.xp%500}/500｜每 10,000 世界回合進入下一季，不重置角色與裝備。</div></div><div class="ct19Card"><h3>🎁 賽季里程碑</h3><div class="sub">每提升 1 級可領星塵；高階獎勵以養成資源為主。</div><button id="ct19SeasonClaim" ${lv<=M.season.claimed?'disabled':''}>領取 Lv.${M.season.claimed+1}～${lv} 獎勵</button></div></div>`;

}
function ensureAdventure(){let b=document.getElementById('ct19AdventureBack');if(b)return b;b=document.createElement('div');b.id='ct19AdventureBack';b.innerHTML=`<div class="ct19Modal"><div class="ct19Head"><div><b>🧭 冒險中心</b><div class="sub">技能・星級・羈絆・地圖・任務・成就・賽季・設定</div></div><button id="ct19Close">✕ 關閉</button></div><div class="ct19Tabs" id="ct19Tabs"></div><div class="ct19Body" id="ct19Body"></div></div>`;document.body.appendChild(b);b.querySelector('#ct19Close').onclick=()=>b.classList.remove('open');b.addEventListener('click',e=>{if(e.target===b)b.classList.remove('open')});return b}

ked;applySettings();saveM()};[fx,dm,sv,au,ac,pc,st].filter(Boolean).forEach(x=>x.onchange=apply)}}
function openAdventure(){const b=ensureAdventure();renderAdventure();b.classList.add('open')}
function installButton(){if(document.getElementById('ct19AdventureBtn'))return;const dock=document.querySelector('.ctDock176')||document.querySelector('.topBtns')||document.querySelector('.controls');if(!dock)return;const b=document.createElement('button');b.id='ct19AdventureBtn';b.innerHTML='🧭 冒險';b.onclick=openAdventure;dock.appendChild(b)}
function boot(){resetPeriod();applySettings();try{for(const s of states||[])if(s&&!s.v19Stats)initPartyMeta(s)}catch(_e){}installButton();ensureBattleHud();decorateBattle();setInterval(decorateBattle,M.settings.powerSaver?800:400);saveM()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
window.__CT19={meta:M,save:saveM,open:openAdventure,role:roleInfo,skills:SKILLS,synergy,affixes:itemAffixes,setInfo,autoEquip};
})();

<script id="ct1902HorizontalDragMapScript">
function bindHorizontalMap1902(root=document){
  const map=root.querySelector?.('.ct19Map');
  if(!map || map.dataset.drag1902==='1') return;
  map.dataset.drag1902='1';

  // 加一個操作提示，不佔太多空間。
  const hint=document.createElement('div');
  hint.className='ct19MapHint1902';
  hint.innerHTML='<b>↔ 可左右拖曳</b><span>手機滑動・電腦按住拖動・滾輪可橫向捲動</span>';
  map.parentNode.insertBefore(hint,map);

  // 包一層做左右漸層提示。
  const wrap=document.createElement('div');
  wrap.className='ct19MapWrap1902';
  map.parentNode.insertBefore(wrap,map);
  wrap.appendChild(map);

  let down=false,startX=0,startScroll=0,moved=false;

  map.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return; // 觸控直接用瀏覽器原生慣性滑動
    if(e.button!==0) return;
    down=true; moved=false; startX=e.clientX; startScroll=map.scrollLeft;
    map.classList.add('ct1902Dragging');
    try{map.setPointerCapture(e.pointerId)}catch(_){}
  });

  map.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-startX;
    if(Math.abs(dx)>4) moved=true;
    map.scrollLeft=startScroll-dx;
    if(moved) e.preventDefault();
  });

  const stop=e=>{
    if(!down) return;
    down=false;
    map.classList.remove('ct1902Dragging');
    try{map.releasePointerCapture(e.pointerId)}catch(_){}
  };
  map.addEventListener('pointerup',stop);
  map.addEventListener('pointercancel',stop);
  map.addEventListener('lostpointercapture',()=>{down=false;map.classList.remove('ct1902Dragging')});

  // 在章節地圖上使用滾輪時，優先轉成橫向捲動。
  map.addEventListener('wheel',e=>{
    if(map.scrollWidth<=map.clientWidth) return;
    const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    if(!delta) return;
    map.scrollLeft+=delta;
    e.preventDefault();
  },{passive:false});

  // 防止拖動完被當成點擊。
  map.addEventListener('click',e=>{
    if(moved){e.preventDefault();e.stopPropagation();moved=false}
  },true);

  // 開啟地圖頁時，自動把目前章節捲到可視區中央。
  requestAnimationFrame(()=>{
    const current=map.querySelector('.ct19Chapter.current');
    if(current){
      const target=current.offsetLeft-(map.clientWidth-current.offsetWidth)/2;
      map.scrollLeft=Math.max(0,target);
    }
  });
}
